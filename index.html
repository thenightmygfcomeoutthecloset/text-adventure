<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="异界卷 - AI驱动的自由文字冒险游戏">
<meta name="theme-color" content="#0d0c14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<meta property="og:title" content="异界卷 · 文字冒险">
<meta property="og:description" content="AI驱动的自由文字冒险">

<!-- ═══════════════════ SECURITY HEADERS ═══════════════════ -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

<title>异界卷 · 文字冒险</title>
<link rel="stylesheet" href="样式.css?v=0.7.5">
</head>
<body>
<noscript>
  <div style="padding: 20px; text-align: center; color: #fff;">
    请启用 JavaScript 以游玩《异界卷》。
  </div>
</noscript>

<main id="main-content">
<!-- ═══════════════════ TITLE SCREEN ═══════════════════ -->
<section id="title-screen" class="screen active">
  <div class="title-main">
    <h1>异 界 卷</h1>
    <p class="subtitle">自 由 文 字 冒 险</p>
    <p class="version-tag">v0.7.5「A11y重构」</p>
  </div>
  <div class="title-actions">
    <div class="settings-section settings-section-api">
      <label for="api-key-input" class="visually-hidden">API 密钥</label>
      <input type="password" id="api-key-input" placeholder="输入你的 DeepSeek API 密钥" autocomplete="off" class="api-key-input">
      <p class="api-hint">密钥仅保存在你的本地浏览器中，不会上传至任何服务器</p>
    </div>

    <!-- Auth Section -->
    <div id="auth-section" class="auth-section">
      <div id="auth-logged-out" class="auth-buttons-row">
        <button id="btn-guest" class="btn-guest" onclick="guestLogin()">👤 游客登录</button>
        <button id="btn-show-login" class="ghost" onclick="showLoginModal()">📧 登录 / 注册</button>
      </div>
      <div id="auth-logged-in" class="auth-status hidden">
        <span class="auth-user-icon">👤</span>
        <span id="auth-user-email" class="auth-user-email" aria-live="polite"></span>
        <button id="btn-signout" class="ghost" onclick="signOut()">退出</button>
      </div>
    </div>

    <!-- Login Modal Overlay -->
    <div id="login-modal" class="login-modal hidden" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
      <div class="login-modal-bg" onclick="closeLoginModal()"></div>
      <div class="login-modal-panel">
        <button class="login-modal-close" aria-label="关闭" onclick="closeLoginModal()">✕</button>
        <h3 id="login-modal-title" class="login-modal-title">登录 / 注册</h3>
        <p class="login-modal-hint">支持手机号或邮箱，数据云端同步</p>
        <label for="auth-email" class="visually-hidden">手机号或邮箱</label>
        <input type="text" id="auth-email" placeholder="请输入手机号 / 邮箱" autocomplete="off" class="auth-input">
        <label for="auth-password" class="visually-hidden">密码</label>
        <input type="password" id="auth-password" placeholder="请输入密码（至少6位）" autocomplete="current-password" class="auth-input">
        <div class="auth-buttons">
          <button id="btn-signin" onclick="handleSignIn()">登 录</button>
          <button id="btn-signup" class="ghost" onclick="handleRegister()">注 册</button>
        </div>
      </div>
    </div>

    <button onclick="goToFreqScreen()">开 启 新 篇</button>
    <button class="ghost initially-hidden" id="btn-continue" onclick="continueGame()">继续未完成的冒险</button>
    <button class="ghost initially-hidden" id="btn-load-slot" onclick="showSaveManager()">读取存档</button>
  </div>
</section>

<!-- ═══════════════════ FREQ SCREEN ═══════════════════ -->
<section id="freq-screen" class="screen hidden">
  <div class="settings-container">
    <h2>选 择 频 段</h2>

    <div class="settings-section">
      <h3>选择你感兴趣的故事方向</h3>
      <div class="freq-grid">
        <button class="freq-card" onclick="selectFrequency('male')">
          <div class="freq-icon">🔥</div>
          <div class="freq-name">男 频</div>
          <div class="freq-desc">玄幻·武侠·科幻·历史·赘婿·战神·无限流</div>
        </button>
        <button class="freq-card" onclick="selectFrequency('female')">
          <div class="freq-icon">💐</div>
          <div class="freq-name">女 频</div>
          <div class="freq-desc">宫斗·霸总·重生·古言·萌宝·年代·双男主</div>
        </button>
      </div>
      <div class="genre-grid" id="tab-common">
        <button class="genre-card" data-genre="穿越小说"><div class="icon">📖</div><div class="name">穿越小说</div><div class="desc">上传小说·AI解析·穿入书中</div></button>
        <button class="genre-card" data-genre="自定义"><div class="icon">✍️</div><div class="name">自定义</div><div class="desc">书写你自己的世界</div></button>
      </div>
    </div>

    <button class="btn-back" onclick="showScreen('title')">← 返回</button>
  </div>
</section>

<!-- ═══════════════════ WORLD SCREEN ═══════════════════ -->
<section id="world-screen" class="screen hidden">
  <div class="settings-container">
    <h2>选 择 世 界</h2>

    <div class="settings-section">
      <h3 id="world-freq-label">选择一个世界</h3>
      <div class="genre-grid initially-hidden" id="grid-male">
        <button class="genre-card" data-genre="奇幻仙侠"><div class="icon">🏔️</div><div class="name">奇幻仙侠</div><div class="desc">灵气·功法·宗门·飞升</div></button>
        <button class="genre-card" data-genre="传统玄幻"><div class="icon">🔥</div><div class="name">传统玄幻</div><div class="desc">斗气·血脉·逆袭·诸天</div></button>
        <button class="genre-card" data-genre="武侠江湖"><div class="icon">🏮</div><div class="name">武侠江湖</div><div class="desc">武功·门派·江湖·恩怨</div></button>
        <button class="genre-card" data-genre="科幻"><div class="icon">🚀</div><div class="name">科幻</div><div class="desc">星际·AI·未来·探索</div></button>
        <button class="genre-card" data-genre="末日废土"><div class="icon">☢️</div><div class="name">末日废土</div><div class="desc">生存·变异·废墟·资源</div></button>
        <button class="genre-card" data-genre="赛博朋克"><div class="icon">🤖</div><div class="name">赛博朋克</div><div class="desc">义体·企业·黑客·霓虹</div></button>
        <button class="genre-card" data-genre="蒸汽朋克"><div class="icon">⚙️</div><div class="name">蒸汽朋克</div><div class="desc">齿轮·飞艇·维多利亚·炼金</div></button>
        <button class="genre-card" data-genre="无限流"><div class="icon">♾️</div><div class="name">无限流</div><div class="desc">副本·系统·轮回·进化</div></button>
        <button class="genre-card" data-genre="都市修真"><div class="icon">🏙️</div><div class="name">都市修真</div><div class="desc">都市·灵气·隐世·觉醒</div></button>
        <button class="genre-card" data-genre="都市高武"><div class="icon">🥊</div><div class="name">都市高武</div><div class="desc">古武·现代·强者·守护</div></button>
        <button class="genre-card" data-genre="历史古代"><div class="icon">📜</div><div class="name">历史古代</div><div class="desc">权谋·争霸·朝代·英雄</div></button>
        <button class="genre-card" data-genre="赘婿"><div class="icon">🏠</div><div class="name">赘婿</div><div class="desc">隐忍·打脸·逆袭·豪门</div></button>
        <button class="genre-card" data-genre="战神"><div class="icon">🎖️</div><div class="name">战神</div><div class="desc">归来·守护·铁血·碾压</div></button>
        <button class="genre-card" data-genre="重生崛起"><div class="icon">🔄</div><div class="name">重生崛起</div><div class="desc">重生·先知·布局·巅峰</div></button>
        <button class="genre-card" data-genre="悬疑灵异"><div class="icon">👻</div><div class="name">悬疑灵异</div><div class="desc">诡异·民俗·禁忌·收容</div></button>
      </div>
      <div class="genre-grid initially-hidden" id="grid-female">
        <button class="genre-card" data-genre="宫斗宅斗"><div class="icon">👑</div><div class="name">宫斗宅斗</div><div class="desc">后宫·内院·心计·上位</div></button>
        <button class="genre-card" data-genre="霸总"><div class="icon">💼</div><div class="name">霸总</div><div class="desc">总裁·契约·虐恋·深情</div></button>
        <button class="genre-card" data-genre="重生复仇"><div class="icon">💔</div><div class="name">重生复仇</div><div class="desc">重生·复仇·逆袭·虐渣</div></button>
        <button class="genre-card" data-genre="禁忌情缘"><div class="icon">🌹</div><div class="name">禁忌情缘</div><div class="desc">宫闱·征服·身份·沉沦</div></button>
        <button class="genre-card" data-genre="都市异能"><div class="icon">🌃</div><div class="name">都市异能</div><div class="desc">现代·超能力·隐秘组织</div></button>
        <button class="genre-card" data-genre="西幻史诗"><div class="icon">⚔️</div><div class="name">西幻史诗</div><div class="desc">魔法·龙·冒险者·遗迹</div></button>
        <button class="genre-card" data-genre="克苏鲁"><div class="icon">🐙</div><div class="name">克苏鲁</div><div class="desc">恐怖·未知·理智·古神</div></button>
        <button class="genre-card" data-genre="古言脑洞"><div class="icon">🪭</div><div class="name">古言脑洞</div><div class="desc">穿越·系统·空间·破局</div></button>
        <button class="genre-card" data-genre="玄幻言情"><div class="icon">💫</div><div class="name">玄幻言情</div><div class="desc">仙魔·虐恋·宿命·情深</div></button>
        <button class="genre-card" data-genre="萌宝"><div class="icon">👶</div><div class="name">萌宝</div><div class="desc">天才萌宝·助攻·甜宠</div></button>
        <button class="genre-card" data-genre="年代文"><div class="icon">📻</div><div class="name">年代文</div><div class="desc">知青·改革·时代·奋斗</div></button>
        <button class="genre-card" data-genre="双男主"><div class="icon">🤝</div><div class="name">双男主</div><div class="desc">强强·宿敌·守护·并肩</div></button>
        <button class="genre-card" data-genre="马甲"><div class="icon">🎭</div><div class="name">马甲</div><div class="desc">隐藏·反差·揭穿·震撼</div></button>
      </div>
      <div class="genre-grid" id="tab-common-world">
        <button class="genre-card" data-genre="穿越小说"><div class="icon">📖</div><div class="name">穿越小说</div><div class="desc">上传小说·AI解析·穿入书中</div></button>
        <button class="genre-card" data-genre="自定义"><div class="icon">✍️</div><div class="name">自定义</div><div class="desc">书写你自己的世界</div></button>
      </div>
      <button class="btn-random-all mt-8" onclick="randomWorld()">🎲 随机世界</button>
      
      <label for="custom-world-desc" class="visually-hidden">自定义世界描述</label>
      <textarea id="custom-world-desc" class="hidden" placeholder="描述你想要的世界：时代背景、力量体系、种族、科技水平、氛围基调……越详细越好。"></textarea>
      <button id="ai-gen-world-btn" class="ai-gen-btn hidden" onclick="aiGenerateWorld()">✨ AI 随机生成世界</button>
      
      <div id="novel-upload-area" class="hidden novel-upload-area">
        <p class="novel-upload-hint">上传你喜欢的 .txt 小说文件，AI 将解析世界观并让你穿越其中</p>
        <label for="novel-file-input" class="visually-hidden">上传小说文件</label>
        <input type="file" id="novel-file-input" accept=".txt" class="visually-hidden" onchange="handleNovelFile(this)">
        <div class="upload-row">
          <button class="ai-gen-btn mt-0" onclick="document.getElementById('novel-file-input').click()">📁 选择文件</button>
          <span id="novel-file-name" class="novel-file-name"></span>
        </div>
        <label for="novel-preview" class="visually-hidden">小说内容预览</label>
        <textarea id="novel-preview" class="hidden novel-preview-textarea" readonly placeholder="小说内容预览……"></textarea>
        <button id="btn-parse-novel" class="ai-gen-btn hidden mt-8" onclick="processNovel()">🔮 解析世界观并穿越</button>
      </div>
    </div>

    <button class="btn-primary" onclick="goToCharScreen()">下 一 步</button>
    <button class="btn-back" onclick="showScreen('freq')">← 返回选择频段</button>
  </div>
</section>

<!-- ═══════════════════ CHARACTER SCREEN ═══════════════════ -->
<section id="char-screen" class="screen hidden">
  <div class="settings-container">
    <h2>角 色 创 建</h2>

    <div class="settings-section" id="char-create-section">
      <h3>▍塑造你的化身</h3>
      <div class="cc-section">
        <div class="cc-label"><label for="player-name-input">姓名</label> <button class="cc-random ml-8" onclick="randomName()">🎲 随机</button></div>
        <input type="text" id="player-name-input" placeholder="你在这个世界中被如何称呼？" maxlength="20">
      </div>
      <div class="cc-section">
        <div class="cc-label">性别 <button class="cc-random ml-8" onclick="randomGender()">🎲 随机</button></div>
        <div class="gender-toggle" id="gender-toggle">
          <button class="gender-option" data-gender="男" onclick="selectGender('男')">男</button>
          <button class="gender-option" data-gender="女" onclick="selectGender('女')">女</button>
          <button class="gender-option" data-gender="其他" onclick="selectGender('其他')">不设</button>
        </div>
      </div>
      <div class="cc-section">
        <div class="cc-label">命格 <span class="cc-desc">影响命运走向</span> <button class="cc-random ml-8" onclick="randomDestiny()">🎲 随机</button></div>
        <div class="cc-options" id="destiny-options"></div>
      </div>
      <div id="char-attrs-container"></div>
      <div class="cc-section" id="advanced-section">
        <button class="cc-label advanced-toggle" onclick="toggleAdvancedOptions()" aria-expanded="false" aria-controls="advanced-content">⚙ 其他设定 <span class="advanced-arrow">▸</span></button>
        <div class="advanced-content hidden" id="advanced-content">
          <div class="cc-section">
            <div class="cc-label">剧情风格</div>
            <div class="cc-options" id="story-style-options"></div>
          </div>
          <div class="cc-section">
            <div class="cc-label">剧情失控度</div>
            <div class="cc-options" id="chaos-level-options"></div>
          </div>
        </div>
      </div>
      <button class="btn-random-all" onclick="randomAllAttributes()">🎲 一键随机角色</button>
    </div>

    <button class="btn-primary" onclick="startNewGame()">踏 入 世 界</button>
    <button class="btn-back" onclick="showScreen('world')">← 返回</button>
  </div>
</section>

<!-- ═══════════════════ GAME SCREEN ═══════════════════ -->
<section id="game-screen" class="screen hidden">
  <nav id="stats-bar" aria-label="游戏状态">
    <div id="stats-items"></div>
    <div id="location-tag"></div>
    <div id="destiny-tag" class="destiny-tag" title=""></div>
    <div class="top-dropdown" id="adventure-dropdown">
      <button class="dropdown-toggle" onclick="toggleTopDropdown(event)" aria-haspopup="menu" aria-expanded="false"><span>冒险</span><span class="triangle">▼</span></button>
      <div class="dropdown-menu hidden" id="top-dropdown-menu" role="menu">
        <button onclick="showAnnals(); toggleTopDropdown(event)" role="menuitem">📜 世界年表</button>
        <button onclick="showInventory(); toggleTopDropdown(event)" role="menuitem">📦 随身物品</button>
        <button onclick="showRelationships(); toggleTopDropdown(event)" role="menuitem">💞 角色羁绊</button>
      </div>
    </div>
    <button class="font-ctrl" onclick="changeFontSize(-1)" aria-label="缩小字号" title="缩小字号">A-</button>
    <button class="font-ctrl" onclick="changeFontSize(1)" aria-label="放大字号" title="放大字号">A+</button>
    <button class="menu-btn" onclick="toggleMenuDrawer()" aria-label="系统菜单" title="系统菜单">☰</button>
  </nav>

  <div id="narrative-area" aria-live="polite"></div>

  <div id="input-dock">
    <div id="suggestion-bar">
      <button id="btn-suggest" class="suggestion-ask-btn" onclick="requestSuggestions()" aria-label="请求行动建议">💡</button>
      <button id="btn-daredevil" class="suggestion-ask-btn daredevil-btn" onclick="daredevilAction()" aria-label="作死行动">💀</button>
      <button id="btn-undo" class="suggestion-ask-btn action-history-btn" onclick="undoLast()" aria-label="回退一步" style="display:none">↩️</button>
      <button id="btn-regenerate" class="suggestion-ask-btn action-history-btn" onclick="regenerateLast()" aria-label="重新生成" style="display:none">🔄</button>
      <div id="suggestion-buttons"></div>
    </div>
    <div id="input-area">
      <span id="input-prompt" aria-hidden="true">▸</span>
      <label for="command-input" class="visually-hidden">输入行动指令</label>
      <input type="text" id="command-input" placeholder="你要做什么？" autocomplete="off" maxlength="500">
      <button id="btn-send">发送</button>
    </div>
  </div>
</section>

</main>

<!-- ═══════════════════ OVERLAYS ═══════════════════ -->
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="overlay-panel" id="overlay-content"></div>
</div>

<!-- ═══════════════════ DRAWER MENU ═══════════════════ -->
<nav id="menu-drawer" class="menu-drawer hidden" aria-label="主菜单">
  <div class="menu-drawer-bg" onclick="toggleMenuDrawer()"></div>
  <div class="menu-drawer-panel">
    <div class="menu-drawer-header">
      <h3>系统菜单</h3>
      <button class="menu-drawer-close" aria-label="关闭菜单" onclick="toggleMenuDrawer()">×</button>
    </div>
    <div class="menu-drawer-grid">
      <button onclick="saveGame(); toggleMenuDrawer()">💾<span>保存读取</span></button>
      <button onclick="exportStory(); toggleMenuDrawer()">📄<span>导出故事</span></button>
      <button onclick="showAchievements(); toggleMenuDrawer()">🏆<span>成就图鉴</span></button>
      <button onclick="showScreen('title'); toggleMenuDrawer()" class="danger-btn">🚪<span>退出游戏</span></button>
    </div>
  </div>
</nav>

<!-- ═══════════════════ TOAST ═══════════════════ -->
<div id="toast" role="alert" aria-live="polite"></div>

<div id="achievement-popup" class="achievement-popup hidden" role="alert" aria-live="polite"></div>
<script src="数据.js?v=0.7.5"></script>
<script src="游戏.js?v=0.7.5"></script>
</body>
</html>
