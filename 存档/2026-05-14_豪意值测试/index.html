<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豪意值测试 · SBTI风格嘉豪人格鉴定</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #2a2a2a;
    --text: #ccc;
    --text-secondary: #888;
    --accent: #ff4444;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  .container { width: 100%; max-width: 520px; padding: 20px; }

  /* 首页 */
  .splash {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .splash .logo {
    font-size: 72px;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .splash h1 {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ff4444, #ff8000);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .splash .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .splash .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
  }
  .splash .tag {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 48px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .btn:hover { background: #ff5555; transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
  .btn:active { transform: translateY(0); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: var(--card); box-shadow: none; }

  /* 进度条 */
  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* 题目区 */
  .quiz { display: none; min-height: 100vh; padding-top: 40px; }
  .quiz.active { display: block; }
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .question-number {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }
  .question-text {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .question-emoji { font-size: 40px; margin-bottom: 16px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 15px;
    text-align: left;
    color: var(--text);

  .option:hover {
    border-color: var(--accent);
    background: #1a1a1a;
  }
  .option.selected {
    border-color: var(--accent);
    background: #1a1010;
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .option .opt-label {
    display: inline-block;
    background: var(--border);
    border-radius: 8px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-secondary);
  }
  .option.selected .opt-label {
    background: var(--accent);
    color: #fff;
  }
  .quiz .btn-next {
    width: 100%;
    margin-top: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .quiz .btn-next.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* 结果页 */
  .result { display: none; }
  .result.active { display: block; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    margin-top: 60px;
  }
  .result-type-emoji { font-size: 80px; margin-bottom: 16px; }
  .result-type-name {
    font-size: 36px;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .result-type-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .result-score {
    background: var(--bg);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .score-bar-bg {
    background: var(--border);
    border-radius: 10px;
    height: 14px;
    overflow: hidden;
    margin-top: 8px;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff4444, #ff8000);
    transition: width 1s ease;
  }
  .score-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }
  .result-desc {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-secondary);
    margin-bottom: 24px;
    text-align: left;
  }
  .result-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .result-tag {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
  }

  .type-pure .result-type-name { color: #ff4444; }

  .type-academic .result-type-name { color: #a29bfe; }
  .type-jiaxin .result-type-name { color: #fd79a8; }
  .type-watcher .result-type-name { color: #fdcb6e; }
  .type-anti .result-type-name { color: #00b894; }
  .type-shy .result-type-name { color: #74b9ff; }
  .type-immune .result-type-name { color: #636e72; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-up { animation: slideUp 0.5s ease forwards; }
</style>
</head>

// ===== 状态 =====
let currentQ = 0;
let score = 0;
let answers = [];

function startQuiz() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('quiz').classList.add('active');
  currentQ = 0;
  score = 0;
  answers = [];
  renderQuestion();
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').textContent = currentQ + 1;
  document.getElementById('qProgress').textContent = (currentQ + 1) + '/' + questions.length;
  document.getElementById('qEmoji').textContent = q.emoji;
  document.getElementById('qText').textContent = (currentQ + 1) + '. ' + q.text;
  document.getElementById('progressFill').style.width = ((currentQ / questions.length) * 100) + '%';

  // 重新渲染选项
  const optsDiv = document.getElementById('qOptions');
  optsDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<span class="opt-label">' + ['A', 'B', 'C', 'D'][i] + '</span><br>' + opt.label;
    div.onclick = function() { selectOption(i); };
    optsDiv.appendChild(div);
  });

  // 如果之前有答案，恢复选择
  if (answers[currentQ] !== undefined) {
    optsDiv.children[answers[currentQ]].classList.add('selected');
    document.getElementById('btnNext').classList.add('visible');
  } else {
    document.getElementById('btnNext').classList.remove('visible');
  }

  // 滚动到顶部
  window.scrollTo(0, 0);

  // 动画
  document.getElementById('quiz').classList.remove('slide-up');
  void document.getElementById('quiz').offsetWidth;
  document.getElementById('quiz').classList.add('slide-up');
}

function selectOption(index) {
  // 如果之前选过别的，先扣除
  if (answers[currentQ] !== undefined) {
    score -= questions[currentQ].options[answers[currentQ]].score;
  }
  answers[currentQ] = index;
  score += questions[currentQ].options[index].score;

  // 更新UI
  const opts = document.getElementById('qOptions').children;
  for (let o of opts) o.classList.remove('selected');
  opts[index].classList.add('selected');
  document.getElementById('btnNext').classList.add('visible');
}

function nextQuestion() {
  if (answers[currentQ] === undefined) return;

  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').classList.add('active');

  const percent = Math.round((score / (questions.length * 3)) * 100);

  // 找到对应的结果类型
  let resultType = resultTypes[resultTypes.length - 1];
  for (let i = 0; i < resultTypes.length; i++) {
    if (percent >= resultTypes[i].minScore) {
      resultType = resultTypes[i];
      break;
    }
  }

  const card = document.getElementById('resultCard');
  card.className = 'result-card slide-up ' + resultType.cssClass;
  card.innerHTML = `
    <div class="result-type-emoji">${resultType.emoji}</div>
    <div class="result-type-name">${resultType.name}</div>
    <div class="result-type-subtitle">${resultType.subtitle}</div>
    <div class="result-score">
      <div class="score-label">
        <span>豪意值</span>
        <span style="color:${resultType.color};font-weight:700;">${percent}%</span>
      </div>
      <div class="score-bar-bg">
        <div class="score-bar-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="result-desc">${resultType.desc}</div>
    <div class="result-tags">
      ${resultType.tags.map(t => '<span class="result-tag">#' + t + '</span>').join('')}
    </div>
    <button class="btn" onclick="shareResult()">📤 分享结果</button>
    <button class="btn btn-secondary" onclick="restartQuiz()">🔄 重新测试</button>
  `;

  // 延迟动画条形图
  setTimeout(() => {
    const bar = card.querySelector('.score-bar-fill');
    if (bar) bar.style.width = percent + '%';
  }, 300);

  window.scrollTo(0, 0);
}

function shareResult() {
  const name = document.querySelector('.result-type-name').textContent;
  const emoji = document.querySelector('.result-type-emoji').textContent;
  const subtitle = document.querySelector('.result-type-subtitle').textContent;
  const scoreText = document.querySelector('.score-label span:last-child').textContent;
  const tags = Array.from(document.querySelectorAll('.result-tag')).map(t => t.textContent).join(' ');

  const shareText = `🎭 我的豪意值测试结果：\n\n${emoji} ${name}\n${subtitle}\n豪意值：${scoreText}\n\n${tags}\n\n你也来测测你的豪意值有多高？\n👉 ${window.location.href}`;

  if (navigator.share) {
    navigator.share({ title: '豪意值测试 - 嘉豪人格鉴定', text: shareText }).catch(() => {});
  } else {
    navigator.clipboard.writeText(shareText).then(() => {
      alert('✅ 结果已复制！粘贴分享给朋友吧～');
    }).catch(() => {
      alert(shareText);
    });
  }
}

function restartQuiz() {
  currentQ = 0;
  score = 0;
  answers = [];
  document.getElementById('result').classList.remove('active');
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('quiz').classList.add('active');
  document.getElementById('progressFill').style.width = '0%';
  renderQuestion();
  window.scrollTo(0, 0);
}

// 禁止意外返回
window.addEventListener('popstate', function(e) {
  if (document.getElementById('quiz').classList.contains('active') || document.getElementById('result').classList.contains('active')) {
    history.pushState(null, '', window.location.href);
  }
});
history.pushState(null, '', window.location.href);
</script>
