<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>后台 · 异界卷</title>
<style>
  :root {
    --bg: #0b0a10; --bg-panel: #121118; --bg-input: #181720;
    --text: #c4b898; --text-bright: #e8dfcc; --text-dim: #6b6558;
    --accent: #8b7528; --accent-bright: #d4af37; --danger: #c47a7a;
    --border: #25231c; --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .lock-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .lock-box {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 32px; width: 90%; max-width: 400px; text-align: center;
  }
  .lock-box h1 { font-size: 24px; font-weight: 400; letter-spacing: 4px; margin-bottom: 8px; }
  .lock-box .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 24px; }
  .lock-box label { display: block; text-align: left; font-size: 11px; color: var(--text-dim); margin: 12px 0 4px; letter-spacing: 1px; }
  .lock-box input {
    width: 100%; padding: 10px 14px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 14px; text-align: center;
  }
  .lock-box input:focus { border-color: var(--accent); outline: none; }
  .lock-box button {
    margin-top: 20px; width: 100%; padding: 10px;
    background: var(--accent); color: var(--text-bright);
    border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; letter-spacing: 2px;
  }
  .lock-box button:hover { background: var(--accent-bright); color: #fff; }
  .lock-box button:disabled { opacity: 0.4; cursor: not-allowed; }
  .lock-error { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 20px; }
  .lock-note { margin-top: 20px; font-size: 11px; color: var(--text-dim); line-height: 1.6; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  .header h1 { font-size: 20px; font-weight: 400; letter-spacing: 3px; }
  .header-actions { display: flex; gap: 8px; }
  .header-actions button {
    padding: 6px 14px; background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius); cursor: pointer; font-size: 12px;
  }
  .header-actions button:hover { border-color: var(--accent); }

  .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px; flex: 1; min-width: 120px; text-align: center;
  }
  .stat-card .num { font-size: 28px; color: var(--accent-bright); font-weight: 300; }
  .stat-card .label { font-size: 11px; color: var(--text-dim); margin-top: 4px; letter-spacing: 1px; }

  .user-table { width: 100%; border-collapse: collapse; }
  .user-table th, .user-table td {
    padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .user-table th { color: var(--text-dim); font-weight: 400; font-size: 11px; letter-spacing: 1px; }
  .user-table tr:hover td { background: rgba(139,117,40,0.04); }
  .user-table .mono { font-family: "SF Mono", "Consolas", monospace; font-size: 11px; color: var(--text-dim); }
  .user-table button {
    padding: 3px 10px; background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .user-table button:hover { border-color: var(--accent); color: var(--accent-bright); }
  .user-table button.danger { color: var(--danger); }
  .user-table button.danger:hover { border-color: var(--danger); }

  .detail-panel {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-top: 16px;
    max-height: 500px; overflow-y: auto; display: none;
  }
  .detail-panel.open { display: block; }
  .detail-panel pre {
    font-size: 11px; color: var(--text); white-space: pre-wrap; word-break: break-all;
    font-family: "SF Mono", "Consolas", monospace;
  }
  .detail-panel h3 { font-weight: 400; margin-bottom: 12px; color: var(--accent-bright); letter-spacing: 2px; }
  .empty { text-align: center; padding: 60px 0; color: var(--text-dim); font-size: 14px; }
  .loading { text-align: center; padding: 40px 0; color: var(--text-dim); }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--border);
    color: var(--text); padding: 8px 20px; border-radius: var(--radius);
    font-size: 13px; z-index: 100; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Lock screen — requires both admin password AND service_role key -->
<div id="lock-screen" class="lock-screen">
  <div class="lock-box">
    <h1>异 界 卷</h1>
    <div class="sub">后 台 管 理</div>
    <label for="admin-password">管理密码</label>
    <input type="password" id="admin-password" placeholder="输入管理密码" autocomplete="off">
    <label for="service-key">Supabase Service Role Key</label>
    <input type="password" id="service-key" placeholder="从 Supabase Dashboard 获取" autocomplete="off">
    <button onclick="unlock()">进 入 后 台</button>
    <div class="lock-error" id="lock-error"></div>
    <div class="lock-note">
      ⚠️ 此页面需要两项凭据：管理密码 + Supabase service_role key。<br>
      请勿将此文件部署到公开位置。service_role key 拥有数据库完全访问权限。
    </div>
  </div>
</div>

<div id="dashboard" style="display:none">
  <div class="container">
    <div class="header">
      <h1>后 台 管 理</h1>
      <div class="header-actions">
        <button onclick="loadData()">🔄 刷新</button>
        <button onclick="lock()">🚪 退出</button>
      </div>
    </div>
    <div class="stats-row" id="stats-row"></div>
    <div style="margin-bottom:8px;font-size:12px;color:var(--text-dim);letter-spacing:1px">▍用户存档列表（game_saves 表）</div>
    <div id="user-list"></div>
    <div class="detail-panel" id="detail-panel"></div>
  </div>
</div>

<script>
var API_URL = 'https://cydvlahdycqttljesokw.supabase.co';
var ADMIN_PASSWORD = 'admin888';
// ⚠️ 请修改 ADMIN_PASSWORD 为你自己的管理密码
var SERVICE_KEY = '';  // 运行时从输入框获取，不硬编码在文件中
var unlocked = false;

function apiHeaders() {
  return {
    'Authorization': 'Bearer ' + SERVICE_KEY,
    'apikey': SERVICE_KEY,
    'Content-Type': 'application/json'
  };
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

function unlock() {
  var pw = document.getElementById('admin-password').value;
  var sk = document.getElementById('service-key').value.trim();
  var errEl = document.getElementById('lock-error');

  if (!pw || !sk) {
    errEl.textContent = '管理密码和 service_role key 缺一不可';
    return;
  }
  if (pw !== ADMIN_PASSWORD) {
    errEl.textContent = '管理密码错误';
    return;
  }

  SERVICE_KEY = sk;
  // Quick validation: try a simple query
  var btn = document.querySelector('.lock-box button');
  btn.disabled = true; btn.textContent = '验证中...';
  errEl.textContent = '';

  fetch(API_URL + '/rest/v1/game_saves?select=id&limit=1', {
    headers: apiHeaders()
  }).then(function(resp) {
    if (resp.ok) {
      unlocked = true;
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      errEl.textContent = 'Service role key 无效或无权访问 game_saves 表 (HTTP ' + resp.status + ')';
    }
  }).catch(function(e) {
    errEl.textContent = '连接失败: ' + (e.message || '网络错误');
  }).finally(function() {
    btn.disabled = false; btn.textContent = '进 入 后 台';
  });
}

function lock() {
  unlocked = false;
  SERVICE_KEY = '';
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('admin-password').value = '';
  document.getElementById('service-key').value = '';
}

document.getElementById('admin-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('service-key').focus();
});
document.getElementById('service-key').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});

async function loadData() {
  if (!unlocked) return;
  document.getElementById('user-list').innerHTML = '<div class="loading">加载中……</div>';
  document.getElementById('detail-panel').classList.remove('open');

  try {
    // Query game_saves via PostgREST — service_role bypasses RLS
    var resp = await fetch(API_URL + '/rest/v1/game_saves?select=*&order=updated_at.desc&limit=500', {
      headers: apiHeaders()
    });
    if (!resp.ok) {
      var errText = await resp.text().catch(function(){ return 'HTTP ' + resp.status; });
      document.getElementById('user-list').innerHTML = '<div class="empty">查询失败: ' + errText + '</div>';
      return;
    }
    var rows = await resp.json();
    renderUserList(rows || []);
  } catch(e) {
    document.getElementById('user-list').innerHTML = '<div class="empty">请求失败: ' + esc(e.message) + '</div>';
  }
}

function renderUserList(rows) {
  // Group by user_id
  var users = {};
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var uid = r.user_id;
    if (!uid) continue;
    if (!users[uid]) { users[uid] = { id: uid, saves: [], lastModified: null }; }
    users[uid].saves.push(r);
    if (r.updated_at && (!users[uid].lastModified || r.updated_at > users[uid].lastModified)) {
      users[uid].lastModified = r.updated_at;
    }
  }

  var userList = [];
  for (var uid in users) { userList.push(users[uid]); }
  userList.sort(function(a, b){ return (b.lastModified || '').localeCompare(a.lastModified || ''); });

  var totalSaves = 0;
  for (var j = 0; j < userList.length; j++) {
    totalSaves += userList[j].saves.length;
  }
  document.getElementById('stats-row').innerHTML =
    '<div class="stat-card"><div class="num">' + userList.length + '</div><div class="label">注册用户数</div></div>' +
    '<div class="stat-card"><div class="num">' + totalSaves + '</div><div class="label">存档总数</div></div>' +
    '<div class="stat-card"><div class="num">' + rows.length + '</div><div class="label">game_saves 行</div></div>';

  if (userList.length === 0) {
    document.getElementById('user-list').innerHTML = '<div class="empty">暂无用户存档</div>';
    return;
  }

  var html = '<table class="user-table"><thead><tr><th>用户 ID</th><th>存档数</th><th>最后活跃</th><th>操作</th></tr></thead><tbody>';
  for (var k = 0; k < userList.length; k++) {
    var u = userList[k];
    html += '<tr>' +
      '<td class="mono">' + esc(u.id.substring(0, 12) + '...') + '</td>' +
      '<td>' + u.saves.length + '</td>' +
      '<td>' + (u.lastModified ? new Date(u.lastModified).toLocaleString('zh-CN') : '-') + '</td>' +
      '<td>' +
        '<button onclick="viewUser(\'' + escAttr(u.id) + '\')">查看存档</button> ' +
        '<button class="danger" onclick="deleteUser(\'' + escAttr(u.id) + '\')">删除全部</button>' +
      '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('user-list').innerHTML = html;
}

async function viewUser(userId) {
  var panel = document.getElementById('detail-panel');
  panel.classList.add('open');
  panel.innerHTML = '<div class="loading">加载中……</div>';

  try {
    var resp = await fetch(API_URL + '/rest/v1/game_saves?select=*&user_id=eq.' + encodeURIComponent(userId) + '&order=updated_at.desc', {
      headers: apiHeaders()
    });
    if (!resp.ok) { panel.innerHTML = '<h3>错误</h3><pre>HTTP ' + resp.status + '</pre>'; return; }
    var saves = await resp.json();

    var html = '<h3>用户: <span class="mono">' + esc(userId) + '</span> (' + saves.length + ' 个存档)</h3>';
    html += '<table class="user-table"><thead><tr><th>槽位</th><th>角色</th><th>世界</th><th>标题</th><th>更新时间</th><th>操作</th></tr></thead><tbody>';
    for (var i = 0; i < saves.length; i++) {
      var s = saves[i];
      var time = s.updated_at ? new Date(s.updated_at).toLocaleString('zh-CN') : '-';
      html += '<tr>' +
        '<td>' + (s.slot === 0 ? '🔄 自动' : '💾 #' + (s.slot + 1)) + '</td>' +
        '<td>' + esc(s.character_name || '-') + '</td>' +
        '<td>' + esc(s.world_name || '-') + '</td>' +
        '<td>' + esc(s.title || '-') + '</td>' +
        '<td>' + time + '</td>' +
        '<td>' +
          '<button onclick="viewSaveDetail(\'' + escAttr(s.id) + '\')">详情</button> ' +
          '<button class="danger" onclick="deleteSave(\'' + escAttr(s.id) + '\',\'' + escAttr(userId) + '\')">删除</button>' +
        '</td>' +
        '</tr>';
    }
    html += '</tbody></table>';
    panel.innerHTML = html;
  } catch(e) {
    panel.innerHTML = '<h3>错误</h3><pre>' + esc(e.message) + '</pre>';
  }
}

async function viewSaveDetail(saveId) {
  var panel = document.getElementById('detail-panel');
  try {
    var resp = await fetch(API_URL + '/rest/v1/game_saves?id=eq.' + encodeURIComponent(saveId) + '&limit=1', {
      headers: apiHeaders()
    });
    if (!resp.ok) { toast('查询失败: HTTP ' + resp.status); return; }
    var rows = await resp.json();
    if (!rows || rows.length === 0) { toast('存档不存在'); return; }
    var s = rows[0];
    var obj = s.save_data || {};
    panel.innerHTML =
      '<h3>存档详情 <span class="mono">' + esc(s.id) + '</span></h3>' +
      '<table class="user-table" style="margin-bottom:12px">' +
      '<tr><td>槽位</td><td>' + (s.slot === 0 ? '自动存档 (0)' : s.slot) + '</td></tr>' +
      '<tr><td>角色名</td><td>' + esc(s.character_name || '-') + '</td></tr>' +
      '<tr><td>世界</td><td>' + esc(s.world_name || '-') + '</td></tr>' +
      '<tr><td>章节</td><td>' + esc(s.title || '-') + '</td></tr>' +
      '<tr><td>位置</td><td>' + esc(obj.location || '-') + '</td></tr>' +
      '<tr><td>性别</td><td>' + esc((obj.characterSheet && obj.characterSheet.gender) || '-') + '</td></tr>' +
      '<tr><td>游戏已开始</td><td>' + (obj.gameStarted ? '是' : '否') + '</td></tr>' +
      '<tr><td>物品</td><td>' + (obj.inventory || []).length + ' 件</td></tr>' +
      '<tr><td>羁绊</td><td>' + (obj.relationships || []).length + ' 个</td></tr>' +
      '<tr><td>成就</td><td>' + (obj.unlockedAchievements || []).length + ' 个</td></tr>' +
      '<tr><td>保存时间</td><td>' + (obj.savedAt ? new Date(obj.savedAt).toLocaleString('zh-CN') : '-') + '</td></tr>' +
      '</table>' +
      '<details><summary style="cursor:pointer;color:var(--text-dim);font-size:12px">完整 JSON (save_data)</summary>' +
      '<pre style="margin-top:8px">' + esc(JSON.stringify(obj, null, 2)) + '</pre></details>';
  } catch(e) {
    panel.innerHTML = '<h3>错误</h3><pre>' + esc(e.message) + '</pre>';
  }
}

async function deleteSave(saveId, userId) {
  if (!confirm('确认删除此存档？')) return;
  try {
    var resp = await fetch(API_URL + '/rest/v1/game_saves?id=eq.' + encodeURIComponent(saveId), {
      method: 'DELETE',
      headers: apiHeaders()
    });
    if (resp.ok) {
      toast('已删除');
      viewUser(userId);  // Refresh user detail
    } else {
      toast('删除失败: HTTP ' + resp.status);
    }
  } catch(e) {
    toast('删除失败: ' + e.message);
  }
}

async function deleteUser(userId) {
  if (!confirm('确认删除用户 ' + userId + ' 的全部存档？此操作不可撤销。')) return;
  try {
    var resp = await fetch(API_URL + '/rest/v1/game_saves?user_id=eq.' + encodeURIComponent(userId), {
      method: 'DELETE',
      headers: apiHeaders()
    });
    if (resp.ok) {
      toast('已删除该用户全部存档');
      loadData();  // Refresh list
    } else {
      toast('删除失败: HTTP ' + resp.status);
    }
  } catch(e) {
    toast('删除失败: ' + e.message);
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
