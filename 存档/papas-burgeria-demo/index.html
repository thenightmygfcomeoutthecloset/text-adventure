<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>江村面馆 - 苏州江村店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#2a2a1e;font-family:sans-serif}
#wrapper{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#container{position:relative;overflow:hidden;background:#3a2a1a;border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,.5)}
#canvas{display:block;touch-action:none}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;align-items:center;justify-content:center}
#startBtn{pointer-events:auto;background:#8b3a2a;color:#f5e6d0;border:none;border-radius:16px;font-size:26px;font-weight:bold;padding:18px 52px;cursor:pointer;box-shadow:0 6px 0 #5a2218;transition:transform .1s;font-family:'KaiTi','STKaiti',serif;letter-spacing:4px}
#startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #5a2218}
</style>
</head>
<body>
<div id="wrapper">
<div id="container">
<canvas id="canvas"></canvas>
<div id="overlay"><button id="startBtn">江村面馆</button></div>
</div>
</div>
<script>
// ============================================================
// 江村面馆 - 苏式汤面烹饪游戏
// ============================================================

// ---- Canvas ----
const cnv=document.getElementById('canvas');
const ctx=cnv.getContext('2d');
const W=390, H=750;
cnv.width=W; cnv.height=H;
let sc=1;

function resize(){
 const ww=window.innerWidth, wh=window.innerHeight;
 sc=Math.min(ww/W, wh/H)*0.95;
 const cw=W*sc, ch=H*sc;
 cnv.style.width=cw+'px'; cnv.style.height=ch+'px';
 const ct=document.getElementById('container');
 ct.style.width=cw+'px'; ct.style.height=ch+'px';
}
window.addEventListener('resize',resize); resize();

// ---- Colors ----
const C={
 wall:'#f2ece4', roof:'#3a3228', roofL:'#5a4a3a',
 floor:'#b8a898', floorL:'#a09080',
 wood:'#4a3520', woodW:'#8b6f4e',
 water:'#8ab8c8', sky:'#d4e8ee',
 willow:'#7aad7a',
 text:'#3d2b1f', textL:'#9a8a7a', white:'#f5e6d0',
 success:'#3a7a4a', fail:'#c0392b', info:'#3d7a9a',
 tab:'#8b3a2a', tabOff:'#b8a898',
 star:'#f1c40f', starE:'#ccc',
 progress:'#ddd', progressF:'#c0392b',
 // 食物
 noodle:'#f0d890', noodleS:'#d4b870',
 brothRed:'#8b4513', brothClear:'#e8d8a0',
 pork:'#8b3a2a', fish:'#d4a040', veg:'#4a9a4a',
 bamboo:'#d4c870', mushroom:'#6b4a3a', shrimp:'#e8a090',
 scallion:'#3a8a3a', egg:'#f0d040',
 bowl:'#f0ece8', bowlS:'#d0ccc8',
};

// ---- Labels ----
const DONENESS={firm:'硬面',medium:'适中',soft:'软面'};
const BROTH={red:'红汤',clear:'白汤',dry:'拌面'};
const TOPPINGS={
 pork:'焖肉', fish:'爆鱼', veg:'青菜',
 bamboo:'笋片', mushroom:'香菇', shrimp:'虾仁'
};
const TOPPING_ORDER=['pork','fish','veg','bamboo','mushroom','shrimp'];
const TOPPING_COLORS={
 pork:'#8b3a2a',fish:'#d4a040',veg:'#4a9a4a',
 bamboo:'#d4c870',mushroom:'#6b4a3a',shrimp:'#e8a090'
};

// ---- State ----
const G={
 phase:'menu', day:1, score:0, served:0, perDay:3,
 customer:null, order:null,
 // 煮面
 cooking:false, doneness:0, noodleDone:false, noodleSt:'',
 // 调汤
 broth:'', brothDone:false,
 // 浇头
 topSteps:[], topStep:0, topAdded:[], topComplete:false,
 // 上菜
 rating:0, serveDone:false,
 orderTaken:false,
 fb:'', fbT:0,
 ci:0, scores:[],
 af:0, _tabs:[], _btn:null,
};

// ---- Names ----
const NAMES=['小明','小红','大伟','小美','阿杰','莉莉','阿强','小琪'];
const SKINS=['#f5d0b0','#e8c4a0','#d4a078','#f0c8a8'];
const HAIRS=['#2c3e50','#8e44ad','#e74c3c','#f39c12','#1a1a2e','#7f8c8d'];

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}

// ---- Generation ----
function genC(i){
 return {name:NAMES[i%NAMES.length],skin:SKINS[rnd(0,3)],hair:HAIRS[rnd(0,5)],hs:rnd(1,4),patience:40+rnd(0,15)};
}
function genO(){
 const d=['firm','medium','soft'][rnd(0,2)];
 const b=['red','clear','dry'][rnd(0,2)];
 const t=[];
 if(Math.random()<0.7) t.push(TOPPING_ORDER[rnd(0,5)]);
 if(Math.random()<0.5) t.push(TOPPING_ORDER[rnd(0,5)]);
 if(Math.random()<0.3) t.push(TOPPING_ORDER[rnd(0,5)]);
 // deduplicate
 const uniq=[...new Set(t)];
 return {noodle:d,broth:b,toppings:uniq.slice(0,3)};
}
function calcTopSteps(o){
 const s=['pork','fish','veg','bamboo','mushroom','shrimp'].filter(t=>o.toppings.includes(t));
 return s;
}

// ---- Drawing Utils ----
function rc(x,y,w,h,r,f,s){
 ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
 if(f){ctx.fillStyle=f;ctx.fill()}
 if(s){ctx.strokeStyle=s;ctx.lineWidth=2;ctx.stroke()}
}

// 江南窗景
function drawWindow(){
 const wx=18,wy=62,ww=120,wh=150;
 ctx.fillStyle=C.sky; ctx.fillRect(wx,wy,ww,wh);
 ctx.fillStyle='rgba(150,175,170,0.35)';
 ctx.beginPath(); ctx.moveTo(wx,wy+wh-55);
 ctx.lineTo(wx+20,wy+wh-80); ctx.lineTo(wx+50,wy+wh-60);
 ctx.lineTo(wx+80,wy+wh-85); ctx.lineTo(wx+ww,wy+wh-65);
 ctx.lineTo(wx+ww,wy+wh-35); ctx.closePath(); ctx.fill();
 ctx.fillStyle='#e8e0d8'; ctx.fillRect(wx+60,wy+wh-85,50,45); ctx.fillRect(wx+75,wy+wh-95,35,55);
 ctx.fillStyle=C.roof;
 ctx.beginPath(); ctx.moveTo(wx+55,wy+wh-87); ctx.lineTo(wx+85,wy+wh-108); ctx.lineTo(wx+115,wy+wh-87); ctx.fill();
 ctx.beginPath(); ctx.moveTo(wx+70,wy+wh-97); ctx.lineTo(wx+92,wy+wh-115); ctx.lineTo(wx+112,wy+wh-97); ctx.fill();
 ctx.fillStyle=C.water; ctx.fillRect(wx,wy+wh-32,ww,32);
 ctx.fillStyle=C.waterDark||'#6a98a8';
 for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(wx+8+i*13,wy+wh-22+((i%2)?-3:3),3,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle=C.wood;
 ctx.beginPath(); ctx.moveTo(wx+18,wy+wh-18); ctx.lineTo(wx+65,wy+wh-18); ctx.lineTo(wx+58,wy+wh-10); ctx.lineTo(wx+25,wy+wh-10); ctx.closePath(); ctx.fill();
 ctx.fillStyle='#ddd';
 ctx.beginPath(); ctx.moveTo(wx+32,wy+wh-17); ctx.lineTo(wx+32,wy+wh-38); ctx.lineTo(wx+52,wy+wh-17); ctx.fill();
 ctx.strokeStyle=C.willow; ctx.lineWidth=1.5;
 for(let i=0;i<7;i++){const sx=wx+4+i*3;ctx.beginPath();ctx.moveTo(sx,wy+wh-40);ctx.quadraticCurveTo(sx-8,wy+wh-80,sx-2,wy+wh-28);ctx.stroke()}
 ctx.strokeStyle=C.wood; ctx.lineWidth=5; ctx.strokeRect(wx,wy,ww,wh);
 ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(wx+ww/2,wy); ctx.lineTo(wx+ww/2,wy+wh); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(wx,wy+wh/2); ctx.lineTo(wx+ww,wy+wh/2); ctx.stroke();
 ctx.fillStyle=C.wood; ctx.fillRect(wx-4,wy+wh,ww+8,7);
}

function drawDecor(){
 ctx.fillStyle='#f5ede0'; rc(W-55,68,40,90,2,'#f5ede0','#4a3520');
 ctx.fillStyle=C.text; ctx.font='bold 12px serif'; ctx.textAlign='center';
 ['江','村','味','道'].forEach((c,i)=>ctx.fillText(c,W-35,90+i*20));
 ctx.fillStyle='#c0392b';
 ctx.beginPath(); ctx.ellipse(60,72,12,18,0,0,Math.PI*2); ctx.fill();
 ctx.fillStyle='#f1c40f'; ctx.fillRect(54,55,12,5);
 ctx.fillStyle='#f5d76e'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('春',60,77);
 ctx.strokeStyle=C.wood; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(60,55); ctx.lineTo(60,44); ctx.stroke();
 const px=W-50,py=205; ctx.fillStyle=C.woodW; rc(px-16,py,32,24,4);
 ctx.fillStyle='#3a6a3a'; ctx.beginPath(); ctx.ellipse(px,py-3,20,12,0,0,Math.PI*2); ctx.fill();
 ctx.fillStyle='#5a9a5a'; ctx.beginPath(); ctx.ellipse(px-5,py-8,9,6,0.3,0,Math.PI*2); ctx.fill();
 ctx.beginPath(); ctx.ellipse(px+6,py-6,8,5,-0.2,0,Math.PI*2); ctx.fill();
}

// 人物
function drawCust(cx,by,s=1){
 const c=G.customer; if(!c) return;
 ctx.fillStyle='#e8d5c4'; ctx.fillRect(cx-20*s,by-50*s,40*s,50*s);
 ctx.fillStyle=c.skin; ctx.beginPath(); ctx.arc(cx,by-70*s,28*s,0,Math.PI*2); ctx.fill();
 ctx.fillStyle=c.hair;
 if(c.hs%2===0){ctx.beginPath();ctx.arc(cx,by-78*s,28*s,Math.PI,Math.PI*2);ctx.fill()}
 else{ctx.beginPath();ctx.arc(cx,by-82*s,30*s,Math.PI*1.1,Math.PI*1.9);ctx.fill()}
 ctx.fillStyle='#3d2b1f'; ctx.beginPath();ctx.arc(cx-10*s,by-72*s,3*s,0,Math.PI*2);ctx.fill(); ctx.beginPath();ctx.arc(cx+10*s,by-72*s,3*s,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#c0392b'; ctx.lineWidth=2*s; ctx.beginPath();ctx.arc(cx,by-62*s,8*s,0.1,Math.PI-0.1);ctx.stroke();
 ctx.fillStyle=C.text; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText(c.name,cx,by-90*s);
}

// 订单气泡
function drawOrder(cx,cy,o,w=160,h=105){
 if(!o) return;
 rc(cx-w/2,cy-h/2,w,h,10,'rgba(255,255,255,0.95)','#ccc');
 ctx.fillStyle=C.text; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
 ctx.fillText('面条: '+DONENESS[o.noodle], cx, cy-35);
 ctx.fillText('汤底: '+BROTH[o.broth], cx, cy-18);
 if(o.toppings.length){
  let x=cx-35;
  o.toppings.forEach(t=>{
   const col=TOPPING_COLORS[t]||'#999';
   ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,cy+12,12,0,Math.PI*2); ctx.fill();
   ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
   ctx.fillText(TOPPINGS[t]?.[0]||'?', x, cy+16); x+=35;
  });
 } else {
  ctx.fillStyle=C.textL; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText('无浇头',cx,cy+12);
 }
}

// ===== 食物绘制 =====
function drawBowl(cx,cy,sc2=1){
 const s=sc2;
 ctx.fillStyle=C.bowlS; ctx.beginPath(); ctx.ellipse(cx,cy+20*s,70*s,18*s,0,0,Math.PI*2); ctx.fill();
 ctx.fillStyle=C.bowl; ctx.beginPath(); ctx.ellipse(cx,cy,65*s,16*s,0,0,Math.PI*2); ctx.fill();
 ctx.strokeStyle='#ccc'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(cx,cy,65*s,16*s,0,0,Math.PI*2); ctx.stroke();
}

function drawNoodles(cx,cy,sc2=1){
 const s=sc2;
 for(let i=0;i<12;i++){
  const x=cx-40*s+i*8*s+2*s*(i%3);
  ctx.strokeStyle=i%2?C.noodle:C.noodleS; ctx.lineWidth=3*s;
  ctx.beginPath(); ctx.moveTo(x,cy);
  ctx.quadraticCurveTo(x+10*s,cy-20*s,x-5*s,cy-40*s);
  ctx.stroke();
 }
}

function drawBroth(cx,cy,type,sc2=1){
 const s=sc2;
 if(type==='red') ctx.fillStyle=C.brothRed;
 else if(type==='clear') ctx.fillStyle=C.brothClear;
 else return; // 拌面无汤
 ctx.globalAlpha=0.6; ctx.beginPath(); ctx.ellipse(cx,cy,55*s,10*s,0,0,Math.PI*2); ctx.fill();
 ctx.globalAlpha=1;
}

function drawTopping(cx,cy,id,sc2=1){
 const s=sc2;
 switch(id){
  case 'pork': // 焖肉
   ctx.fillStyle=C.pork; rc(cx-16*s,cy-8*s,32*s,16*s,4);
   ctx.fillStyle='rgba(0,0,0,0.15)'; rc(cx-12*s,cy-4*s,24*s,4*s,2);
   break;
  case 'fish': // 爆鱼
   ctx.fillStyle=C.fish; ctx.beginPath();
   ctx.moveTo(cx,cy-14*s); ctx.lineTo(cx+16*s,cy+6*s); ctx.lineTo(cx-16*s,cy+6*s); ctx.closePath(); ctx.fill();
   ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.moveTo(cx,cy-8*s); ctx.lineTo(cx+8*s,cy+2*s); ctx.lineTo(cx-8*s,cy+2*s); ctx.closePath(); ctx.fill();
   break;
  case 'veg': // 青菜
   ctx.fillStyle=C.veg;
   for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(cx-8*s+i*8*s,cy+2*s,5*s,10*s,0.2,0,Math.PI*2);ctx.fill()}
   ctx.fillStyle='#8ab84a'; ctx.beginPath(); ctx.ellipse(cx,cy-6*s,4*s,6*s,0,0,Math.PI*2); ctx.fill();
   break;
  case 'bamboo': // 笋片
   ctx.fillStyle=C.bamboo;
   for(let i=0;i<2;i++){rc(cx-12*s+i*14*s,cy-6*s,10*s,14*s,3);}
   ctx.fillStyle='rgba(255,255,255,0.2)'; rc(cx-10*s+i*14*s,cy-2*s,6*s,6*s,2);
   break;
  case 'mushroom': // 香菇
   ctx.fillStyle=C.mushroom; ctx.beginPath(); ctx.ellipse(cx,cy-2*s,14*s,10*s,0,0,Math.PI*2); ctx.fill();
   ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.ellipse(cx-4*s,cy-6*s,4*s,3*s,0,0,Math.PI*2); ctx.fill();
   break;
  case 'shrimp': // 虾仁
   ctx.fillStyle=C.shrimp;
   for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(cx-10*s+i*10*s,cy-2*s+i*4*s,6*s,4*s,0.3,0,Math.PI*2);ctx.fill()}
   break;
 }
}

function drawFullBowl(cx,cy,order,toppings,sc2=1){
 const s=sc2;
 drawBowl(cx,cy,s);
 if(order&&order.broth!=='dry') drawBroth(cx,cy-4*s,order.broth,s);
 drawNoodles(cx,cy-6*s,s);
 if(toppings&&toppings.length) toppings.forEach((t,i)=>{
  const ox=cx-30*s+Math.min(i,5)*28*s;
  const oy=cy-30*s-(i%2)*10*s;
  drawTopping(ox,oy,t,s);
 });
}

// ===== 站点绘制 =====
function drawOrderStation(){
 const cx=W/2;
 if(G.customer){drawCust(cx,H-190,1.15);drawOrder(cx,H-320,G.order)}
 if(G.orderTaken) return;
 ctx.fillStyle='#e8552b'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
 ctx.fillText('👆 点击"接单"记住顾客需求',cx,220);
}

function drawNoodleStation(){
 const cx=W/2, cy=H/2-40;
 // 锅
 ctx.fillStyle='#555'; rc(60,cy-30,W-120,100,50);
 ctx.fillStyle='#666'; rc(64,cy-26,W-128,92,46);
 // 水
 ctx.fillStyle='rgba(120,180,220,0.5)'; rc(70,cy-18,W-140,70,35);
 if(G.cooking){
  // 气泡
  for(let i=0;i<5;i++){
   ctx.fillStyle=`rgba(255,255,255,${0.1+Math.sin(G.af*0.08+i)*0.1})`;
   ctx.beginPath();ctx.arc(cx-30+rnd(0,60),cy+20-rnd(0,30),3+rnd(0,4),0,Math.PI*2);ctx.fill();
  }
  // 面条在锅中
  ctx.strokeStyle=C.noodle; ctx.lineWidth=4;
  for(let i=0;i<8;i++){
   ctx.beginPath(); ctx.moveTo(cx-35+i*10,cy-5); ctx.quadraticCurveTo(cx-25+i*10,cy-25,cx-30+i*10,cy+15); ctx.stroke();
  }
  // 进度条
  const mx=55,mw=W-110,mh=18;
  ctx.fillStyle=C.progress; rc(mx,cy+45,mw,mh,9);
  const tIdx=['firm','medium','soft'].indexOf(G.order?.noodle||'medium');
  ctx.fillStyle='rgba(46,204,113,0.3)'; rc(mx+mw*(tIdx*0.3+0.05),cy+45,mw*0.25,mh,9);
  ctx.fillStyle=C.progressF; rc(mx,cy+45,mw*G.doneness,mh,9);
  ctx.fillStyle=C.text; ctx.font='9px sans-serif'; ctx.textAlign='center';
  ['硬','适中','软','烂'].forEach((l,i)=>ctx.fillText(l,mx+mw*(i/3),cy+74));
 } else if(G.noodleDone){
  ctx.fillStyle=C.success; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText('✓ 面条煮好了!',cx,cy+50);
 } else {
  ctx.fillStyle=C.textL; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('点击"煮面"开始煮',cx,cy+10);
 }
 // 面条状态标签
 if(G.cooking){
  const sts=['firm','medium','soft','overcooked'];
  const idx=[0,0.25,0.5,0.75,1].findIndex(t=>G.doneness<t);
  const st=sts[Math.max(0,Math.min(3,idx))];
  const stN={firm:'硬面',medium:'适中',soft:'软面',overcooked:'烂了'};
  ctx.fillStyle=C.text; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText(stN[st]||'',cx,cy-40);
 }
}

function drawBrothStation(){
 const cx=W/2, cy=H/2-50;
 // 显示汤碗
 if(!G.broth){
  // 选择汤底
  ctx.fillStyle=C.text; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
  ctx.fillText('选择汤底:',cx,cy);
  const by=cy+15;
  const btns=[
   {id:'red',label:'红汤',color:'#8b4513',x:40,y:by},
   {id:'clear',label:'白汤',color:'#d4b87a',x:150,y:by},
   {id:'dry',label:'拌面',color:'#c4a87a',x:260,y:by},
  ];
  btns.forEach(b=>{
   ctx.fillStyle=b.color; rc(b.x,b.y,80,50,10);
   ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.fillText(b.label,b.x+40,b.y+30);
  });
  G._brothBtns=btns;
 } else {
  // 已选择汤底
  const bNames={red:'红汤',clear:'白汤',dry:'拌面'};
  ctx.fillStyle=C.text; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('已选: '+bNames[G.broth],cx,cy);
  // 汤碗预览
  const bowlCy=cy+50;
  drawBowl(cx,bowlCy,1.1);
  if(G.broth==='red') drawBroth(cx,bowlCy-4,'red',1.1);
  else if(G.broth==='clear') drawBroth(cx,bowlCy-4,'clear',1.1);
  drawNoodles(cx,bowlCy-6,1.1);
  if(G.brothDone){
   ctx.fillStyle=C.success; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText('✓ 汤底备好了',cx,cy+100);
  }
 }
}

function drawToppingsStation(){
 const cx=W/2;
 const steps=G.topSteps;
 if(!steps.length){
  ctx.fillStyle=C.textL; ctx.font='14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('这碗面没有浇头',cx,H/2-20);
  return;
 }
 // 面碗预览
 drawFullBowl(cx,H/2-10,G.order,G.topAdded,0.9);
 // 步骤
 const cur=G.topStep;
 ctx.fillStyle=C.text; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
 if(!G.topComplete){
  const need=steps[cur];
  ctx.fillText('加: '+(TOPPINGS[need]||need),cx,H/2+65);
 } else {
  ctx.fillStyle=C.success; ctx.fillText('浇头已加好!',cx,H/2+65);
 }
 // 浇头按钮
 TOPPING_ORDER.forEach((id,i)=>{
  const bx=10+i*63,bw=56,bh=38,yy=H-145;
  const inSteps=steps.includes(id),si=steps.indexOf(id);
  const done=si>=0&&si<cur,curt=si===cur&&!G.topComplete,no=!inSteps;
  ctx.save();
  if(done){ctx.globalAlpha=0.5}
  else if(no){ctx.globalAlpha=0.3}
  ctx.fillStyle=TOPPING_COLORS[id]||'#999'; rc(bx,yy,bw,bh,8);
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText(TOPPINGS[id]||id,bx+bw/2,yy+bh/2+4);
  if(done){ctx.fillStyle='#27ae60';ctx.font='bold 14px sans-serif';ctx.fillText('✓',bx+bw-10,yy+14)}
  if(no){ctx.fillStyle='#e74c3c';ctx.font='12px sans-serif';ctx.fillText('✕',bx+bw/2,yy+10)}
  if(curt){ctx.lineWidth=3;ctx.strokeStyle='#e8552b';ctx.strokeRect(bx,yy,bw,bh)}
 });
}

function drawServeStation(){
 const cx=W/2, cy=H/2-10;
 if(G.order&&G.topSteps.length){
  drawFullBowl(cx,cy,G.order,G.topAdded,1.1);
 } else if(G.order){
  // 无浇头
  drawFullBowl(cx,cy,G.order,[],1.1);
 }
}

function drawRating(){
 const cx=W/2,cy=H/2-10;
 ctx.fillStyle='rgba(0,0,0,0.65)';rc(cx-135,cy-110,270,220,20);
 ctx.fillStyle=C.white;ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('评分!',cx,cy-60);
 for(let i=0;i<3;i++){ctx.fillStyle=i<G.rating?C.star:C.starE;ctx.font='42px sans-serif';ctx.fillText('★',cx-45+i*50,cy-15)}
 ctx.fillStyle=C.white;ctx.font='bold 18px sans-serif';
 const ms={0:'再接再厉!',1:'不错哟!',2:'很好!',3:'完美!'};
 ctx.fillText(ms[G.rating]||'',cx,cy+40);
 ctx.font='14px sans-serif';ctx.fillStyle='#ddd';ctx.fillText('¥'+(G.rating*20+10),cx,cy+65);
}

// ===== UI =====
function drawTop(){
 ctx.fillStyle='#3a2a1a';ctx.fillRect(0,0,W,48);
 ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,0,W,2);
 ctx.fillStyle='#f5c542';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.fillText('江村面馆',12,17);
 ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText('¥'+G.score,12,37);
 ctx.textAlign='center';ctx.fillStyle='#ccc';ctx.font='11px sans-serif';ctx.fillText('第'+G.day+'天 | '+(G.served+1)+'/'+G.perDay,W/2,18);
 if(G.customer&&!['menu','dayEnd','rating'].includes(G.phase)){
  const p=G.customer.patience;
  ctx.fillStyle=p>20?'#8bc34a':p>10?'#ffc107':'#ff5722';ctx.font='bold 12px sans-serif';ctx.textAlign='right';ctx.fillText('⏱'+Math.ceil(p)+'s',W-12,17);
 }
 const pn={order:'点单',noodle:'煮面',broth:'调汤',toppings:'浇头',serve:'上菜'};
 ctx.fillStyle='#b8a898';ctx.font='11px sans-serif';ctx.textAlign='right';if(pn[G.phase])ctx.fillText(pn[G.phase],W-12,38);
}

function drawTabs(){
 const tabs=[
  {id:'order',x:8},{id:'noodle',x:82},{id:'broth',x:156},{id:'toppings',x:230},{id:'serve',x:304}
 ];
 G._tabs=tabs.map(t=>{
  const act=G.phase===t.id||(G.phase==='rating'&&t.id==='serve');
  // 检查是否可访问
  let unlocked=false;
  if(t.id==='order') unlocked=true;
  else if(t.id==='noodle') unlocked=G.orderTaken;
  else if(t.id==='broth') unlocked=G.noodleDone;
  else if(t.id==='toppings') unlocked=G.brothDone;
  else if(t.id==='serve') unlocked=G.topComplete;
  ctx.globalAlpha=act?1:unlocked?0.8:0.4;
  ctx.fillStyle=act?C.tab:C.tabOff;rc(t.x,H-56,68,36,8);
  ctx.globalAlpha=1;
  ctx.fillStyle=act?'#f5e6d0':unlocked?'#ccc':'#888';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  const lb={order:'点单',noodle:'煮面',broth:'调汤',toppings:'浇头',serve:'上菜'};
  ctx.fillText(lb[t.id],t.x+34,H-35);
  return{id:t.id,x:t.x,w:68,h:36,y:H-56,unlocked};
 });
}

function drawBtn(l,x,y,w,h,c){
 ctx.fillStyle=c||C.tab;rc(x-w/2,y,w,h,14);
 ctx.fillStyle='#f5e6d0';ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.fillText(l,x,y+h/2+6);
 return{x:x-w/2,y,w,h};
}

function drawDayEnd(){
 const cx=W/2;
 ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#f5c542';ctx.font='bold 28px serif';ctx.textAlign='center';ctx.fillText('第'+G.day+'天 打烊',cx,160);
 const total=G.scores.reduce((a,b)=>a+b,0);
 ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText('流水: ¥'+total,cx,220);
 ctx.font='14px sans-serif';ctx.fillStyle='#ccc';G.scores.forEach((s,i)=>ctx.fillText('顾 客 '+(i+1)+' : ¥'+s,cx,270+i*30));
 ctx.fillStyle=C.textL;ctx.font='13px sans-serif';ctx.fillText('- 点击进入下一天 -',cx,H-90);
}

// ===== Render =====
function render(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle=C.wall;ctx.fillRect(0,48,W,H-106);
 ctx.fillStyle=C.roof;ctx.beginPath();ctx.moveTo(0,48);
 for(let x=0;x<=W;x+=8)ctx.lineTo(x,48+(Math.sin(x*0.15)*3|0));
 ctx.lineTo(W,48);ctx.fill();
 ctx.fillStyle=C.roofL;ctx.fillRect(0,48,W,4);
 ctx.fillStyle=C.floor;ctx.fillRect(0,H-106,W,50);
 ctx.strokeStyle=C.floorL;ctx.lineWidth=0.5;
 for(let x=0;x<W;x+=78){ctx.beginPath();ctx.moveTo(x,H-106);ctx.lineTo(x,H-56);ctx.stroke()}
 drawWindow();drawDecor();
 drawTop();
 switch(G.phase){
  case 'order':drawOrderStation();break;case 'noodle':drawNoodleStation();break;
  case 'broth':drawBrothStation();break;case 'toppings':drawToppingsStation();break;
  case 'serve':drawServeStation();break;case 'rating':drawRating();break;
  case 'dayEnd':drawDayEnd();break;
 }
 drawTabs();
 G._btn=null;
 if(G.phase==='order'&&!G.orderTaken)G._btn=drawBtn('接单',W/2,H-100,160,50);
 else if(G.phase==='noodle'&&!G.cooking&&!G.noodleDone)G._btn=drawBtn('煮面',W/2,H-100,160,50);
 else if(G.phase==='noodle'&&G.cooking)G._btn=drawBtn('捞面',W/2,H-100,160,50);
 else if(G.phase==='broth'&&!G.broth){} // buttons handled in drawBrothStation
 else if(G.phase==='broth'&&G.broth&&!G.brothDone)G._btn=drawBtn('汤底搞定',W/2,H-100,160,50,C.success);
 else if(G.phase==='serve'&&G.serveDone){} // no button needed
 else if(G.phase==='serve'&&!G.serveDone)G._btn=drawBtn('上菜!',W/2,H-100,160,55,C.success);
 else if(G.phase==='rating')G._btn=drawBtn('下一位',W/2,H-100,160,50,C.info);
 else if(G.phase==='dayEnd')G._btn=drawBtn('继续',W/2,H-100,160,50,C.info);
 if(G.fbT>0){
  ctx.save();ctx.globalAlpha=Math.min(1,G.fbT*1.5);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=12;
  ctx.fillText(G.fb,W/2,H/2-130);ctx.restore();
 }
}

// ===== Logic =====
function nextC(){
 G.ci++;if(G.ci>=G.perDay){G.phase='dayEnd';G.customer=null;G.order=null;return}
 G.customer=genC(G.ci);G.order=genO();
 G.topSteps=calcTopSteps(G.order);
 G.phase='order';G.orderTaken=false;
 G.cooking=false;G.doneness=0;G.noodleDone=false;G.noodleSt='';
 G.broth='';G.brothDone=false;
 G.topAdded=[];G.topStep=0;G.topComplete=false;
 G.serveDone=false;G.rating=0;G.fb='';G.fbT=0;
}
function startDay(){G.served=0;G.ci=-1;G.scores=[];nextC()}
function calcR(){
 const o=G.order;let s=3;
 if(G.noodleSt!==o.noodle)s--;
 if(G.broth!==o.broth)s--;
 const sv=G.topAdded;o.toppings.forEach(t=>{if(!sv.includes(t))s--});
 sv.forEach(t=>{if(!o.toppings.includes(t))s--});
 G.rating=Math.max(0,s);const p=(G.rating+1)*15;G.score+=p;G.scores.push(p);G.served++;
}

// ===== Input =====
function pos(e){
 const r=cnv.getBoundingClientRect();
 const cx=e.clientX||(e.touches?e.touches[0].clientX:0);
 const cy=e.clientY||(e.touches?e.touches[0].clientY:0);
 return{x:(cx-r.left)/sc,y:(cy-r.top)/sc};
}
function hit(px,py,b){return px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h}

function tap(p){
 const{x,y}=p;
 if(G.phase==='menu')return;
 if(G.phase==='dayEnd'){const b=G._btn;if(b&&hit(x,y,b)){G.day++;G.perDay=Math.min(G.perDay+1,8);startDay()}return}
 if(G.phase==='rating'){const b=G._btn;if(b&&hit(x,y,b)){G.phase='order';setTimeout(()=>nextC(),80)}return}
 // tabs
 for(const t of G._tabs||[]){
  if(!hit(x,y,t))continue;
  if(t.unlocked&&G.phase!==t.id){G.phase=t.id;return}
  if(!t.unlocked){G.fb='先完成前面的步骤!';G.fbT=0.8;return}
 }
 // 汤底按钮（特殊处理）
 if(G.phase==='broth'&&!G.broth&&G._brothBtns){
  for(const b of G._brothBtns){
   if(x>=b.x&&x<=b.x+80&&y>=b.y&&y<=b.y+50){
    G.broth=b.id;G.fb='选了'+(BROTH[b.id]||b.id);G.fbT=0.8;return;
   }
  }
 }
 const ab=G._btn;
 if(ab&&hit(x,y,ab)){act();return}
 // 浇头点击
 if(G.phase==='toppings'&&!G.topComplete)topTap(x,y);
}

function act(){
 switch(G.phase){
  case 'order':
   if(!G.orderTaken){G.orderTaken=true;G.fb='已记住! 去煮面';G.fbT=1.5;setTimeout(()=>{G.phase='noodle'},600)}
   break;
  case 'noodle':
   if(!G.cooking&&!G.noodleDone){G.cooking=true;G.doneness=0;G.fb='开始煮面!';G.fbT=1}
   else if(G.cooking){
    G.cooking=false;G.noodleDone=true;
    const d=G.doneness;let st='firm';
    if(d<0.2)st='firm';else if(d<0.4)st='firm';else if(d<0.6)st='medium';else if(d<0.85)st='soft';else st='overcooked';
    G.noodleSt=st;
    const tg=G.order.noodle;
    if(st===tg)G.fb='面条火候完美!';else if(st==='overcooked')G.fb='煮烂了...';else G.fb='还行';
    G.fbT=1.5;
    setTimeout(()=>{if(G.phase==='noodle'){G.phase='broth';G.fb='调汤吧!';G.fbT=1}},600);
   }
   break;
  case 'broth':
   if(G.broth&&!G.brothDone){G.brothDone=true;G.fb='汤底好了!';G.fbT=1;setTimeout(()=>{if(G.phase==='broth'){G.phase='toppings';G.fb='加浇头!';G.fbT=1}},500)}
   break;
  case 'serve':
   if(!G.serveDone&&G.order){calcR();G.phase='rating';G.serveDone=true}
   break;
 }
}

function topTap(x,y){
 const steps=G.topSteps;
 if(!steps.length||G.topStep>=steps.length)return;
 const need=steps[G.topStep];
 let clicked=null;
 TOPPING_ORDER.forEach(id=>{
  const i=TOPPING_ORDER.indexOf(id),bx=10+i*63;
  if(x>=bx&&x<=bx+56&&y>=H-145&&y<=H-107){clicked=id}
 });
 if(!clicked)return;
 if(clicked===need){
  G.topAdded.push(need);G.topStep++;
  if(G.topStep>=steps.length){G.topComplete=true;G.fb='浇头加好了!';G.fbT=1;setTimeout(()=>{G.phase='serve';G.fb='上菜!';G.fbT=0.8},500)}
  else G.fb='✓ '+(TOPPINGS[need]||need);G.fbT=0.6;
 } else {
  G.fb=!steps.includes(clicked)?'没点这个浇头':'先加'+(TOPPINGS[need]||need);G.fbT=0.9;
 }
}

// ===== Loop =====
let lt=0;
function upd(dt){
 G.af++;
 if(G.cooking)G.doneness=Math.min(1,G.doneness+dt*0.13);
 if(G.customer&&!['menu','dayEnd','rating'].includes(G.phase)){
  G.customer.patience-=dt;
  if(G.customer.patience<=0){
   G.customer.patience=0;G.fb='顾客走了...';G.fbT=2;
   setTimeout(()=>{if(G.phase!=='rating'&&G.phase!=='dayEnd'){G.rating=0;G.score+=5;G.scores.push(5);G.served++;G.serveDone=true;G.phase='rating'}},1500);
  }
 }
 if(G.fbT>0)G.fbT-=dt;
}
function loop(t){
 const dt=Math.min((t-lt)/1000,0.05);lt=t;upd(dt);render();
 requestAnimationFrame(loop);
}

// ===== Start =====
document.getElementById('startBtn').addEventListener('click',()=>{
 document.getElementById('overlay').style.display='none';
 G.day=1;G.score=0;G.perDay=3;startDay();
});
cnv.addEventListener('click',(e)=>{tap(pos(e))});
cnv.addEventListener('touchstart',(e)=>{e.preventDefault();tap(pos(e))},{passive:false});
document.addEventListener('keydown',(e)=>{
 if(e.key==='Enter'||e.key===' '){
  const ov=document.getElementById('overlay');
  if(ov.style.display!=='none'){document.getElementById('startBtn').click();return}
  tap({x:W/2,y:H-75});
 }
});
console.log('🍜 江村面馆 loaded!');
requestAnimationFrame(loop);
</script>
</body>
</html>
