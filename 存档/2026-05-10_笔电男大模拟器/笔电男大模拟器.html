<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔电男大模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
body{font-family:'Noto Sans SC',sans-serif;background:#0a0a12;color:#e0e0e0;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;}
#app{width:100%;max-width:900px;height:100vh;max-height:750px;display:flex;flex-direction:column;padding:16px;gap:12px;}

/* Start Screen */
#startScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:20px;}
#startScreen h1{font-size:48px;font-weight:900;background:linear-gradient(135deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;}
#startScreen .subtitle{color:#888;font-size:16px;max-width:420px;line-height:1.6;}
#startScreen .start-btn{padding:16px 60px;font-size:22px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#00ff88,#00ccff);color:#0a0a12;cursor:pointer;transition:transform .2s,box-shadow .2s;}
#startScreen .start-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(0,255,136,.3);}
#startScreen .controls-hint{color:#555;font-size:13px;margin-top:8px;}

/* Header */
#header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.06);flex-shrink:0;}
#header .day-display{font-size:20px;font-weight:700;}
#header .day-display .period{color:#00ccff;font-weight:400;font-size:15px;margin-left:8px;}
#header .day-display .day-num{color:#00ff88;}
#header .progress-text{color:#666;font-size:13px;}

/* Stats */
#statsPanel{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0;}
.stat-row{display:flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(255,255,255,.03);border-radius:8px;}
.stat-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
.stat-label{font-size:12px;color:#aaa;width:52px;flex-shrink:0;}
.stat-bar-wrap{flex:1;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;position:relative;}
.stat-bar{height:100%;border-radius:4px;transition:width .5s ease;width:50%;}
.stat-bar.money{background:linear-gradient(90deg,#ffd700,#ffaa00);}
.stat-bar.academics{background:linear-gradient(90deg,#00ccff,#0088ff);}
.stat-bar.gaming{background:linear-gradient(90deg,#ff4444,#ff0066);}
.stat-bar.fame{background:linear-gradient(90deg,#bb44ff,#8833ff);}
.stat-bar.energy{background:linear-gradient(90deg,#00ff88,#00cc66);}
.stat-bar.mental{background:linear-gradient(90deg,#ff88cc,#ff44aa);}
.stat-bar.horny{background:linear-gradient(90deg,#ff6699,#ff2244);}
.stat-bar.exam{background:linear-gradient(90deg,#ffaa44,#ff6600);}
.stat-bar.hp{background:linear-gradient(90deg,#ff3333,#cc0000);}
.stat-val{font-size:12px;font-weight:700;width:26px;text-align:right;flex-shrink:0;}

/* Event Area */
#eventArea{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;}
#eventCard{background:rgba(255,255,255,.03);border-radius:12px;border:1px solid rgba(255,255,255,.06);padding:16px;flex:1;display:flex;flex-direction:column;overflow:hidden;}
.event-title{font-size:15px;font-weight:700;color:#00ff88;margin-bottom:6px;flex-shrink:0;}
.event-desc{font-size:14px;line-height:1.7;color:#ccc;flex-shrink:0;}
.event-result{font-size:14px;line-height:1.7;color:#ffcc00;padding:10px;background:rgba(255,204,0,.08);border-radius:8px;margin-top:auto;flex-shrink:0;display:none;}
.event-result .stat-changes{color:#aaa;font-size:12px;margin-top:6px;display:flex;flex-wrap:wrap;gap:3px;}
.event-result .stat-changes span{margin-right:4px;}
.event-result .stat-changes .up{color:#00ff88;}
.event-result .stat-changes .down{color:#ff4444;}

/* Choices */
#choices{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.choice-btn{padding:10px 14px;text-align:left;font-size:13px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.04);color:#ddd;cursor:pointer;transition:all .2s;font-family:inherit;}
.choice-btn:hover{border-color:#00ff88;background:rgba(0,255,136,.08);color:#fff;}
.choice-btn:disabled{opacity:.5;cursor:not-allowed;}
.choice-btn:disabled:hover{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ddd;}
.choice-btn .choice-tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;margin-right:6px;background:rgba(0,255,136,.15);color:#00ff88;}

/* Continue / Next button */
#nextBtn{padding:10px;font-size:15px;font-weight:700;border:none;border-radius:8px;background:linear-gradient(135deg,#00ff88,#00ccff);color:#0a0a12;cursor:pointer;display:none;transition:transform .2s;flex-shrink:0;}
#nextBtn:hover{transform:scale(1.02);}

/* Log */
#logPanel{background:rgba(255,255,255,.03);border-radius:10px;border:1px solid rgba(255,255,255,.06);padding:6px 10px;flex-shrink:0;max-height:70px;overflow-y:auto;}
#logPanel::-webkit-scrollbar{width:4px;}
#logPanel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
.log-entry{font-size:11px;color:#666;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03);}
.log-entry:last-child{border-bottom:none;}
.log-entry .log-day{color:#444;margin-right:6px;}

/* Ending Screen */
#endScreen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:14px;}
#endScreen .end-title{font-size:36px;font-weight:900;}
#endScreen .end-sub{font-size:16px;color:#aaa;max-width:480px;line-height:1.7;}
#endScreen .end-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0;}
#endScreen .end-stat{background:rgba(255,255,255,.04);border-radius:8px;padding:8px 14px;}
#endScreen .end-stat .val{font-size:22px;font-weight:700;}
#endScreen .end-stat .lbl{font-size:11px;color:#666;}
#endScreen .restart-btn{padding:14px 50px;font-size:18px;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#00ff88,#00ccff);color:#0a0a12;cursor:pointer;transition:transform .2s;}
#endScreen .restart-btn:hover{transform:scale(1.05);}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .35s ease;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1s infinite;}

/* Float up notification */
#floatContainer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:100;}
.float-text{position:absolute;font-size:22px;font-weight:900;animation:floatUp 1.2s ease forwards;pointer-events:none;white-space:nowrap;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.2)}}

/* Responsive */
@media(max-width:600px){
  #app{height:100vh;max-height:none;padding:8px;gap:6px;}
  #startScreen h1{font-size:30px;}
  #statsPanel{grid-template-columns:1fr;}
  #header .day-display{font-size:15px;}
  .event-title{font-size:14px;}
  .event-desc{font-size:13px;}
  #endScreen .end-title{font-size:24px;}
  #endScreen .end-stats{grid-template-columns:1fr 1fr;}
  .choice-btn{padding:9px 12px;font-size:12px;}
}
</style>
</head>
<body>

<div id="floatContainer"></div>

<div id="app">
  <!-- Start Screen -->
  <div id="startScreen">
    <h1>📘 笔电男大模拟器</h1>
    <div class="subtitle">
      你是一名普普通通的男大学生，拥有一台RTX 4060游戏本。<br>
      在这个学期里，每一个选择都将塑造你的命运。<br>
      🔞 性压抑指数与 📝 做题区指数也暗中影响着一切……
    </div>
    <button class="start-btn" onclick="startGame()">新学期的开始</button>
    <div class="controls-hint">共20个教学日 · 8项属性 · 9种结局</div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" style="display:none;flex-direction:column;gap:10px;height:100%;">
    <div id="header">
      <div class="day-display">
        <span class="day-num" id="dayNum">第 1 天</span>
        <span class="period" id="periodLabel">早上</span>
      </div>
      <div class="progress-text" id="progressText">第 1 / 80 回合</div>
    </div>

    <div id="statsPanel">
      <div class="stat-row"><span class="stat-icon">💰</span><span class="stat-label">生活费</span><div class="stat-bar-wrap"><div class="stat-bar money" id="statMoney" style="width:60%"></div></div><span class="stat-val" id="valMoney">60</span></div>
      <div class="stat-row"><span class="stat-icon">📚</span><span class="stat-label">学业</span><div class="stat-bar-wrap"><div class="stat-bar academics" id="statAcademics" style="width:50%"></div></div><span class="stat-val" id="valAcademics">50</span></div>
      <div class="stat-row"><span class="stat-icon">🎮</span><span class="stat-label">游戏水平</span><div class="stat-bar-wrap"><div class="stat-bar gaming" id="statGaming" style="width:30%"></div></div><span class="stat-val" id="valGaming">30</span></div>
      <div class="stat-row"><span class="stat-icon">🌐</span><span class="stat-label">网络声望</span><div class="stat-bar-wrap"><div class="stat-bar fame" id="statFame" style="width:20%"></div></div><span class="stat-val" id="valFame">20</span></div>
      <div class="stat-row"><span class="stat-icon">⚡</span><span class="stat-label">体力</span><div class="stat-bar-wrap"><div class="stat-bar energy" id="statEnergy" style="width:70%"></div></div><span class="stat-val" id="valEnergy">70</span></div>
      <div class="stat-row"><span class="stat-icon">❤️</span><span class="stat-label">生命值</span><div class="stat-bar-wrap"><div class="stat-bar hp" id="statHp" style="width:100%"></div></div><span class="stat-val" id="valHp">100</span></div>
      <div class="stat-row"><span class="stat-icon">🧠</span><span class="stat-label">精神状态</span><div class="stat-bar-wrap"><div class="stat-bar mental" id="statMental" style="width:65%"></div></div><span class="stat-val" id="valMental">65</span></div>
      <div class="stat-row"><span class="stat-icon">🔞</span><span class="stat-label">性压抑</span><div class="stat-bar-wrap"><div class="stat-bar horny" id="statHorny" style="width:30%"></div></div><span class="stat-val" id="valHorny">30</span></div>
      <div class="stat-row"><span class="stat-icon">📝</span><span class="stat-label">做题区</span><div class="stat-bar-wrap"><div class="stat-bar exam" id="statExam" style="width:40%"></div></div><span class="stat-val" id="valExam">40</span></div>
    </div>

    <div id="eventArea">
      <div id="eventCard">
        <div class="event-title" id="eventTitle">事件标题</div>
        <div class="event-desc" id="eventDesc">事件描述</div>
        <div class="event-result" id="eventResult"></div>
      </div>
    </div>

    <div id="choices">
      <button class="choice-btn" onclick="makeChoice(0)"><span class="choice-tag">A</span>选项一</button>
      <button class="choice-btn" onclick="makeChoice(1)"><span class="choice-tag">B</span>选项二</button>
      <button class="choice-btn" onclick="makeChoice(2)"><span class="choice-tag">C</span>选项三</button>
    </div>

    <button id="nextBtn" onclick="nextTurn()">继续 ▶</button>

    <div id="logPanel"></div>
  </div>

  <!-- Ending Screen -->
  <div id="endScreen">
    <div class="end-title" id="endTitle">结局名称</div>
    <div class="end-sub" id="endDesc">结局描述</div>
    <div class="end-stats" id="endStatsGrid"></div>
    <button class="restart-btn" onclick="startGame()">再来一次</button>
  </div>
</div>

<script>
// ============ EVENTS DATABASE ============
const EVENTS = [
  // === 学习篇 ===
  {
    id:'early_class', title:'早八的抉择', period:'morning',
    desc:'窗外下着雨，被窝里暖暖的。闹钟已经响了五遍，今天早上是高数课——据说李老师要点名。你翻了个身，感受到被子的封印正在加强。',
    choices:[
      {text:'一个激灵起床，冲去教室', effects:{academics:12,energy:-10,mental:-3,horny:-3,exam:5}, result:'你踩着铃声冲进教室，头发还翘着。李老师看了你一眼，在本子上记了什么——但至少没被记缺勤。和同学们坐在一起上课，感觉也没有那么压抑了。'},
      {text:'再睡一会儿……就一会儿', effects:{energy:8,academics:-8,mental:2,horny:3,exam:-5}, result:'再次睁眼已经是中午了。你打开手机，看到室友发的消息："李老师点名了，你被记了。" 你沉默地刷起了B站，在床上窝了一上午。'},
      {text:'翘课，打开瓦', effects:{academics:-12,gaming:10,energy:5,mental:8,horny:5,exam:-8}, result:'深海明珠地图，捷风起飞，一枪一个！你在枪林弹雨中发泄着过剩的精力。至于高数……人生有舍才有得。'},
    ]
  },
  {
    id:'class_mo fish', title:'课堂上的抉择', period:'morning',
    desc:'你坐在教室最后一排，老师在讲台上滔滔不绝地讲着PPT。手机震了一下——是宿舍群在讨论今晚要不要去网吧五连坐。你看了看黑板，又看了看手机。',
    choices:[
      {text:'放下手机，认真听课做笔记', effects:{academics:10,energy:-5,horny:-2,exam:8}, result:'你破天荒地记了半页笔记。旁边的室友投来诧异的目光，仿佛看到了什么不可思议的事。认真听课让你暂时忘了那些乱七八糟的念头。'},
      {text:'低头刷B站，偶尔抬头装样子', effects:{academics:-3,gaming:2,fame:2,mental:3,horny:3,exam:-3}, result:'你刷到了三个抽象视频、两个游戏攻略，还有一个关于笔电男大的吐槽——你默默点了收藏。B站的美少女推荐算法让你越刷越上火。'},
      {text:'趴下睡觉，养精蓄锐', effects:{energy:15,academics:-5,mental:5,horny:2,exam:-3}, result:'你趴在桌上，在老师的讲课声中进入了梦乡。梦里你瓦的KD突破了3.0。醒来后嘴角还挂着傻笑。'},
    ]
  },
  {
    id:'homework_ddl', title:'作业DDL来了', period:'afternoon',
    desc:'下午打开电脑，发现下周要交三份作业：高数习题集、C语言大作业、还有思政课的3000字论文。而你一个字都没写。你盯着屏幕，大脑一片空白。',
    choices:[
      {text:'打开VS Code认真写代码', effects:{academics:15,energy:-12,mental:-5,exam:10}, result:'你写了两个小时，终于调通了那个链表程序。虽然头发掉了不少，但成就感满满。做题区的身份认同又增强了一分。'},
      {text:'打开百度/谷歌开始复制粘贴', effects:{academics:4,fame:-2,mental:3,exam:2}, result:'你熟练地Ctrl+C/V，半小时搞定了三份作业。虽然质量堪忧，但至少交得上去了。抄作业的时候你感到了做题家特有的熟练。'},
      {text:'算了，先打把瓦再说', effects:{gaming:8,academics:-8,energy:3,mental:7,horny:4,exam:-5}, result:'你说服自己"放松一下效率更高"，然后一打就是四个小时。作业？明天再说吧。打瓦的时候你觉得自己充满了力量。'},
    ]
  },
  {
    id:'exam_cram', title:'期末突击', period:'evening',
    desc:'距离期末考还有三天。你看着崭新的课本和空白的习题集，感受到了前所未有的压力。室友已经在通宵复习了，而你还在想要不要开始。',
    choices:[
      {text:'开启通宵复习模式', effects:{academics:20,energy:-20,mental:-10,horny:5,exam:15}, result:'你灌了两杯咖啡，从晚上十点学到凌晨四点。第二天醒来感觉灵魂出窍，但确实记住了不少公式。做题做得越多，越觉得自己是个纯粹的做题机器。'},

      {text:'打听考试重点，投机取巧', effects:{academics:5,fame:3,mental:5,exam:3,horny:-2}, result:'你在各个群里求重点，最后从学长那搞到了一份"内部资料"。和学长聊天的时候顺便了解了一些实习信息，感觉未来也没那么灰暗。'},
    ]
  },
  {
    id:'course_select', title:'选课大战', period:'morning',
    desc:'选课系统今天开放！你坐在电脑前，盯着屏幕上的课程列表。体育课只剩太极拳了，通识课还有"影视鉴赏""宇宙奥秘"和"创业基础"。你怎么选？',
    choices:[
      {text:'选有用的硬课：Python数据分析', effects:{academics:10,energy:-8,exam:8}, result:'你选了这门据说很硬核的课。第一个作业就花了一整晚，但你感觉确实学到了东西。做题区战魂在燃烧。'},
      {text:'选轻松的水课：影视鉴赏', effects:{academics:3,mental:6,energy:3,exam:-3}, result:'你选了影视鉴赏，听说每周就是看电影写感想。这学期稳了。做题区指数轻微下降——但谁在乎呢？'},

    desc:'小组作业分组结果出来了。你的组员包括：一个从不回消息的、一个说"随便都行"的、和一个"我负责指指点点"的。你看着微信群陷入了沉思。',
    choices:[
      {text:'主动当组长，carry全场', effects:{academics:12,fame:5,energy:-15,mental:-8,exam:8,horny:-3}, result:'你以一己之力完成了80%的工作，最后拿了A。虽然累，但和组员一起讨论的过程让你感受到了久违的团队协作。'},
      {text:'做好自己那份就行', effects:{academics:6,energy:-5,exam:4}, result:'你按时完成了自己负责的部分，虽然整体质量一般，但至少问心无愧。按部就班地完成自己被分配的任务——标准的做题家思维。'},
      {text:'全程隐身，最后蹭个名字', effects:{academics:-5,fame:-8,mental:5,exam:-5,horny:3}, result:'你在群里全程潜水，最后在报告上看到了自己的名字。组员群里多了一个"这人下次别跟他一组"的评价。你假装没看见，关掉了群聊。'},
    ]
  },
  {
    id:'thesis_topic', title:'毕业论文开题', period:'afternoon',
    desc:'大四了，该选毕业论文题目了。导师发来一份选题列表，从"基于深度学习的xxx"到"某某现象的社会学分析"，看起来都不太好对付。',
    choices:[

// ============ GAME STATE ============
let state = {};
let currentEvent = null;
let usedEvents = [];
let turnCount = 0;
const TOTAL_DAYS = 20;
const TURNS_PER_DAY = 4;
const TOTAL_TURNS = TOTAL_DAYS * TURNS_PER_DAY;
const PERIODS = ['morning','afternoon','evening','night'];
const PERIOD_NAMES = {morning:'🌅 早上',afternoon:'☀️ 下午',evening:'🌆 傍晚',night:'🌙 深夜'};

function initState() {
  state = {
    money: 60,
    academics: 50,
    gaming: 30,
    fame: 20,
    energy: 70,
    mental: 65,
    horny: 30,
    exam: 40,
    hp: 100,
    day: 1,
    periodIdx: 0,
    gameOver: false,
    log: [],
    ending: null,
    flags: {},
  };
  turnCount = 0;
  usedEvents = [];
  currentEvent = null;
}

function clamp(v){return Math.max(0,Math.min(100,v))}

function changeStat(key, delta) {
  let old = state[key];
  state[key] = clamp(state[key] + delta);
  return state[key] - old;
}

// ============ UI RENDERING ============
function renderStats() {
  const map = {money:'Money',academics:'Academics',gaming:'Gaming',fame:'Fame',energy:'Energy',mental:'Mental',horny:'Horny',exam:'Exam',hp:'Hp'};
  for(const [k,cls] of Object.entries(map)){
    document.getElementById('stat'+cls).style.width = state[k]+'%';
    document.getElementById('val'+cls).textContent = state[k];
  }
}

function renderHeader() {
  document.getElementById('dayNum').textContent = `第 ${state.day} 天`;
  document.getElementById('periodLabel').textContent = PERIOD_NAMES[PERIODS[state.periodIdx]];
  document.getElementById('progressText').textContent = `第 ${turnCount+1} / ${TOTAL_TURNS} 回合`;
}

function showFloat(text, color) {
  const c = document.getElementById('floatContainer');
  const el = document.createElement('div');
  el.className = 'float-text';
  el.style.color = color || '#fff';
  el.textContent = text;
  el.style.left = (Math.random()*200-100)+'px';
  c.appendChild(el);
  setTimeout(()=>el.remove(), 1300);
}

function addLog(msg) {
  state.log.push(msg);
  const panel = document.getElementById('logPanel');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-day">[第${state.day}天 ${PERIOD_NAMES[PERIODS[state.periodIdx]]}]</span> ${msg}`;
  panel.appendChild(entry);
  panel.scrollTop = panel.scrollHeight;
}

// ============ EVENT SYSTEM ============
function getAvailableEvents() {
  const period = PERIODS[state.periodIdx];
  let pool = EVENTS.filter(e => {
    if(usedEvents.includes(e.id)) return false;
    if(e.period && e.period !== period) return false;
    if(e.condition && !e.condition(state)) return false;
    return true;
  });
  if(pool.length === 0){
    pool = EVENTS.filter(e => {
      if(e.period && e.period !== period) return false;
      if(e.condition && !e.condition(state)) return false;
      return true;
    });
  }
  return pool;
}

function pickEvent() {
  const pool = getAvailableEvents();
  const evt = pool[Math.floor(Math.random() * pool.length)];
  usedEvents.push(evt.id);
  if(usedEvents.length > 30) usedEvents.splice(0, 10);
  return evt;
}

function showEvent(evt) {
  currentEvent = evt;
  document.getElementById('eventTitle').textContent = '📌 ' + evt.title;
  document.getElementById('eventDesc').textContent = evt.desc;
  document.getElementById('eventResult').style.display = 'none';

  const btns = document.querySelectorAll('.choice-btn');
  const tags = ['A','B','C'];
  for(let i=0; i<3; i++){
    if(i < evt.choices.length){
      btns[i].style.display = 'block';
      btns[i].innerHTML = `<span class="choice-tag">${tags[i]}</span>${evt.choices[i].text}`;
      btns[i].disabled = false;
    } else {
      btns[i].style.display = 'none';
    }
  }
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('eventCard').className = 'fade-in';
}

function makeChoice(idx) {
  if(!currentEvent || turnCount >= TOTAL_TURNS) return;
  const choice = currentEvent.choices[idx];
  if(!choice) return;

  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  let changes = [];
  for(const [stat, delta] of Object.entries(choice.effects)){
    const actual = changeStat(stat, delta);
    if(actual !== 0){
      const labels = {money:'💰生活费',academics:'📚学业',gaming:'🎮游戏水平',fame:'🌐网络声望',energy:'⚡体力',mental:'🧠精神状态',horny:'🔞性压抑',exam:'📝做题区',hp:'❤️生命值'};
      const sign = actual > 0 ? '+' : '';
      const color = actual > 0 ? '#00ff88' : '#ff4444';
      changes.push(`<span class="${actual>0?'up':'down'}">${labels[stat]} ${sign}${actual}</span>`);
    }
  }

  const resultDiv = document.getElementById('eventResult');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = choice.result;
  if(changes.length > 0){
    resultDiv.innerHTML += `<div class="stat-changes">${changes.join(' ')}</div>`;
  }

  addLog(`${currentEvent.title} → ${choice.text.substring(0,20)}...`);

  for(const [stat, delta] of Object.entries(choice.effects)){
    if(delta !== 0){
      const labels = {money:'💰',academics:'📚',gaming:'🎮',fame:'🌐',energy:'⚡',mental:'🧠',horny:'🔞',exam:'📝',hp:'❤️'};
      const sign = delta > 0 ? '+' : '';
      const color = delta > 0 ? '#00ff88' : '#ff4444';
      showFloat(`${labels[stat]} ${sign}${delta}`, color);
    }
  }

  // High horny warning
  if(state.horny >= 80) {
    state.mental = clamp(state.mental - 3);
    addLog('⚠️ 性压抑指数过高，精神状态-3');
    showFloat('⚠️ 性压抑在累积...', '#ff2244');
  }

  // 起飞 mechanic: horny >= 85 triggers auto "takeoff"
  if(state.horny >= 85 && !state.ending) {
    state.horny = clamp(state.horny - 35);
    state.energy = clamp(state.energy - 15);
    state.hp = clamp(state.hp - 8);
    state.mental = clamp(state.mental - 5);
    addLog('🔞 性压抑爆表，你忍不住在被窝里"起飞"了...');
    showFloat('🔞 起飞！', '#ff2244');

    if(Math.random() < 0.3) {
      state.fame = clamp(state.fame - 50);
      addLog('😱 舍友突然推门进来！网络声望-50！大型社死现场！');
      showFloat('😱 被发现了！声望-50', '#ff0000');
    }
  }

  const gameOver = checkGameOver();
  if(gameOver) {
    document.getElementById('nextBtn').style.display = 'block';
    document.getElementById('nextBtn').textContent = '查看结局 ▶';
    renderStats();
    return;
  }

  renderStats();

  if(state.energy <= 0) {
    document.getElementById('nextBtn').style.display = 'block';
    document.getElementById('nextBtn').textContent = '体力不支，强制休息...';
    return;
  }

  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').textContent = '继续 ▶';
}

function checkGameOver() {
  if(state.mental <= 0) {
    state.ending = 'mental_break';
    return true;
  }
  if(state.money <= 0) {
    state.ending = 'broke';
    return true;
  }
  if(state.horny >= 95) {
    state.ending = 'horny_explode';
    return true;
  }
  if(state.horny >= 75 && state.mental <= 20) {
    state.ending = 'femboy_awakening';
    return true;
  }
  if(state.hp <= 0) {
    state.ending = 'hp_depleted';
    return true;
  }
  if(turnCount >= TOTAL_TURNS - 1) {
    state.ending = 'end_of_term';
    return true;
  }
  if(state.energy <= 0) {
    return false;
  }
  return false;
}

function nextTurn() {
  if(state.ending) {
    showEnding();
    return;
  }

  if(state.energy <= 0) {
    state.energy = clamp(state.energy + 25);
    state.mental = clamp(state.mental - 5);
    state.horny = clamp(state.horny + 3);
    state.periodIdx++;
    turnCount++;
    if(state.periodIdx >= TURNS_PER_DAY) {
      state.periodIdx = 0;
      state.day++;
    }
    renderStats();
    renderHeader();
    addLog('⚡ 体力不支，强制休息了一整个时段');

    if(state.day > TOTAL_DAYS || turnCount >= TOTAL_TURNS) {
      state.ending = 'end_of_term';
      showEnding();
      return;
    }

    const evt = pickEvent();
    showEvent(evt);
    return;
  }

  state.periodIdx++;
  turnCount++;

  if(state.periodIdx >= TURNS_PER_DAY) {
    state.periodIdx = 0;
    state.day++;
    state.energy = clamp(state.energy + 5);
    // Daily natural horny increase if isolated
    if(state.horny >= 50) state.horny = clamp(state.horny + 1);
    if(state.horny >= 70) state.horny = clamp(state.horny + 1);
  }

  renderHeader();

  if(state.day > TOTAL_DAYS) {
    state.ending = 'end_of_term';
    showEnding();
    return;
  }

  if(Math.random() < 0.08) {
    triggerRandomBonus();
  }

  const evt = pickEvent();
  showEvent(evt);
}

function triggerRandomBonus() {
  const bonuses = [
    {text:'室友请你喝了杯奶茶 🧋', effects:{money:3,mental:5,horny:-2}},
    {text:'在路边捡到了20块钱 💵', effects:{money:5}},
    {text:'B站视频突然多了几个赞 👍', effects:{fame:3,mental:5}},
    {text:'路过看到一只超可爱的猫猫 🐱', effects:{mental:8,horny:-3}},
    {text:'食堂阿姨多给你打了一勺肉 🥩', effects:{energy:5,mental:3}},
    {text:'收到了远方朋友寄来的明信片 💌', effects:{mental:10,horny:-5}},
    {text:'CSGO开箱居然出货了！ 📦', effects:{gaming:5,money:5,mental:12}},
    {text:'社团的学姐主动找你聊天了 💬', effects:{mental:8,horny:-8,exam:-2}},
    {text:'在操场看到了一场绝美日落 🌅', effects:{mental:10,horny:-5}},
  ];
  const bonus = bonuses[Math.floor(Math.random() * bonuses.length)];
  for(const [k,v] of Object.entries(bonus.effects)){
    changeStat(k, v);
  }
  addLog('🎲 ' + bonus.text);
  renderStats();
}

function showEnding() {
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'flex';

  const ending = getEnding();
  document.getElementById('endTitle').textContent = ending.title;
  document.getElementById('endTitle').style.color = ending.color;
  document.getElementById('endDesc').textContent = ending.desc;

  const grid = document.getElementById('endStatsGrid');
  grid.innerHTML = '';
  const items = [
    {lbl:'💰 生活费', val:state.money},
    {lbl:'📚 学业', val:state.academics},
    {lbl:'🎮 游戏水平', val:state.gaming},
    {lbl:'🌐 网络声望', val:state.fame},
    {lbl:'⚡ 体力', val:state.energy},
    {lbl:'🧠 精神状态', val:state.mental},
    {lbl:'🔞 性压抑', val:state.horny},
    {lbl:'📝 做题区', val:state.exam},
    {lbl:'❤️ 生命值', val:state.hp},
  ];
  for(const item of items){
    const div = document.createElement('div');
    div.className = 'end-stat';
    div.innerHTML = `<div class="val">${item.val}</div><div class="lbl">${item.lbl}</div>`;
    grid.appendChild(div);
  }
}

function startGame() {
  initState();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';

  addLog('🎒 新学期开始了！你坐在宿舍里，打开了你的游戏本...');

  const evt = pickEvent();
  showEvent(evt);
}
